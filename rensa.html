<!DOCTYPE html>

<style>
html,body{margin:0;padding:0;height:100%;background:#0b0f1e;overflow:hidden}

.rs-bar .rs-left{flex:1;letter-spacing:1px;white-space:nowrap;overflow:hidden}

<body>
<div id="app"></div>
<script>
// data.js — 数値と文言はすべてここ。ゲームの調整はこのファイルだけ触る。
const DATA = {
  TITLE: 'ホシレンサ',
  GAME_ID: 'rensa',                 // 保存キー uchu.rensa.*

  // 爆発の輪
  BLAST_GROW: 0.35,     // 広がる秒
  BLAST_HOLD: 0.6,      // とどまる秒
  BLAST_SHRINK: 0.25,   // 縮む秒
  TAP_R: 70,            // 起点の最大半径 px
  STAR_R_MIN: 55,       // 星から生まれる爆発の最大半径（直径 18px のとき）
  STAR_R_MAX: 90,       // 同（直径 36px のとき）。間は線形
  FUSE: 0.15,           // 輪に触れてから爆発するまでの秒

  // 星
  D_FIXED: 24,          // ステージ 1〜4 の直径
  D_MIN: 18, D_MAX: 36, // ステージ 5 以降の直径（一様乱数）
  D_RANDOM_FROM: 5,
  KINDS: ['yellow', 'bluewhite', 'white', 'orange', 'red', 'giant'],

  // ステージ表（10 以降は式）
  STAGES: [
    { stars: 50, speed: 20, need: 8,  taps: 1 },
    { stars: 45, speed: 25, need: 10, taps: 1 },
    { stars: 40, speed: 30, need: 11, taps: 1 },
    { stars: 40, speed: 35, need: 13, taps: 1 },
    { stars: 35, speed: 40, need: 14, taps: 1 },
    { stars: 35, speed: 45, need: 15, taps: 1 },
    { stars: 60, speed: 40, need: 26, taps: 2 },
    { stars: 55, speed: 45, need: 27, taps: 2 },
    { stars: 50, speed: 50, need: 27, taps: 2 },
  ],
  LATE_STARS_STEP: -2, LATE_STARS_MIN: 30,
  LATE_SPEED_STEP: 5,  LATE_SPEED_MAX: 90,
  LATE_NEED_RATIO: 0.65,

  // 配置保証：静止状態で「起点 1 回で need 以上消せる場所」があるまで配置し直す
  PLACE_TRIES: 20,
  PLACE_GRID: 24,       // 候補点の間隔 px

  // 背景の切り替え（ステージ番号 → 背景 id）
  BG_STAGES: [[1, 'deep'], [6, 'nebula'], [11, 'galaxy']],

  // 色（アプリ共通トークン）
  COLOR_BG: '#0b0f1e',
  COLOR_TEXT: '#f2f4f8',
  COLOR_ACCENT: '#ffd166',
  COLOR_LINE: 'rgba(255,255,255,0.18)',
  FONT: '"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif',
  // 星の種類ごとの色（画像が無いときの描画用。中心／縁）
  STAR_COLORS: {
    yellow:    ['#fff6c8', '#ffb300'],
    bluewhite: ['#ffffff', '#4fa3ff'],
    white:     ['#ffffff', '#c9d6ff'],
    orange:    ['#ffe0b0', '#ff7a1a'],
    red:       ['#ffb0a0', '#e0301a'],
    giant:     ['#ffb0d0', '#a0205a'],
  },

  TRIVIA: '超新星の衝撃波が、となりの星の誕生や爆発を引き起こすことが本当にあります。',
};
// 画像（ChatGPT で生成したら build.py が埋め込む）。star:<kind> と bg:<id>
const IMAGES = {

};
if (typeof module !== 'undefined') module.exports = DATA;

// engine.js — 星の移動・爆発・連鎖・ステージ判定。DOM を触らない純粋ロジック。
// 使い方: const e = new Engine(DATA, W, H, rng); e.tap(x, y); e.step(dt); e.takeEvents()
function Engine(D, W, H, rng) {
  this.D = D; this.W = W; this.H = H;
  this.rng = rng || Math.random;
  this.reset();
}
Engine.prototype.reset = function () {
  this.stageIndex = 0;   // 0 始まり
  this.total = 0;        // 消した合計
  this.time = 0;
  this.over = false;
  this.events = [];
  this._startStage(0);
};
Engine.prototype.stageDef = function (idx) {
  const D = this.D, S = D.STAGES;
  if (idx < S.length) return Object.assign({}, S[idx]);
  const last = S[S.length - 1], k = idx - (S.length - 1);
  const stars = Math.max(D.LATE_STARS_MIN, last.stars + D.LATE_STARS_STEP * k);
  const speed = Math.min(D.LATE_SPEED_MAX, last.speed + D.LATE_SPEED_STEP * k);
  return { stars, speed, need: Math.ceil(stars * D.LATE_NEED_RATIO), taps: 2 };
};
Engine.prototype.starBlastR = function (d) {
  const D = this.D, t = (d - D.D_MIN) / (D.D_MAX - D.D_MIN);
  return D.STAR_R_MIN + (D.STAR_R_MAX - D.STAR_R_MIN) * Math.max(0, Math.min(1, t));
};
Engine.prototype._makeStars = function (def) {
  const D = this.D, stars = [];
  const stageNo = this.stageIndex + 1;
  for (let i = 0; i < def.stars; i++) {
    const d = stageNo >= D.D_RANDOM_FROM ? D.D_MIN + (D.D_MAX - D.D_MIN) * this.rng() : D.D_FIXED;
    const a = this.rng() * Math.PI * 2;
    stars.push({ id: i, x: d / 2 + (this.W - d) * this.rng(), y: d / 2 + (this.H - d) * this.rng(), d,
      vx: Math.cos(a) * def.speed, vy: Math.sin(a) * def.speed,
      kind: D.KINDS[Math.floor(this.rng() * D.KINDS.length)], state: 'alive', fuse: 0, hue: this.rng() });
  }
  return stars;
};
// 静止配置で (x,y) を起点にしたときの連鎖数（配置保証と自動プレイに使う）
Engine.prototype.chainAt = function (stars, x, y) {
  const D = this.D;
  const alive = stars.filter(s => s.state === 'alive');
  const done = new Set();
  const blasts = [{ x, y, r: D.TAP_R }];
  let count = 0;
  while (blasts.length) {
    const b = blasts.pop();
    for (const s of alive) {
      if (done.has(s.id)) continue;
      const dx = s.x - b.x, dy = s.y - b.y;
      if (dx * dx + dy * dy <= (b.r + s.d / 2) ** 2) { done.add(s.id); count++; blasts.push({ x: s.x, y: s.y, r: this.starBlastR(s.d) }); }
    }
  }
  return count;
};
// 盤面をグリッドで走査して最良の起点を返す
Engine.prototype.bestPoint = function (stars) {
  const g = this.D.PLACE_GRID; let best = { x: this.W / 2, y: this.H / 2, n: -1 };
  for (let y = g / 2; y < this.H; y += g) for (let x = g / 2; x < this.W; x += g) {
    const n = this.chainAt(stars, x, y);
    if (n > best.n) best = { x, y, n };
  }
  return best;
};
Engine.prototype._startStage = function (idx) {
  this.stageIndex = idx;
  const def = this.stageDef(idx);
  this.def = def;
  this.taps = def.taps;
  this.cleared = 0;
  this.blasts = [];
  this.chain = 0;
  let stars = null, best = null;
  for (let t = 0; t < this.D.PLACE_TRIES; t++) {
    stars = this._makeStars(def);
    best = this.bestPoint(stars);
    if (best.n >= def.need) break;
  }
  this.stars = stars;
  this.guaranteed = best.n >= def.need;
  this.events.push({ type: 'stage', index: idx, def, best: best.n });
};
Engine.prototype.busy = function () { return this.blasts.length > 0 || this.stars.some(s => s.state === 'fuse'); };
Engine.prototype.canTap = function () { return !this.over && this.taps > 0 && !this.busy(); };
Engine.prototype.tap = function (x, y) {
  if (!this.canTap()) return false;
  this.taps--;
  this.chain = 0;
  this._blast(x, y, this.D.TAP_R, 0);
  this.events.push({ type: 'tap', x, y, r: this.D.TAP_R, taps: this.taps });
  return true;
};
Engine.prototype._blast = function (x, y, R, chain) {
  this.blasts.push({ x, y, R, t: 0, chain });
};
Engine.prototype.blastRadius = function (b) {
  const D = this.D, t = b.t;
  if (t < D.BLAST_GROW) return b.R * (t / D.BLAST_GROW);
  if (t < D.BLAST_GROW + D.BLAST_HOLD) return b.R;
  const u = (t - D.BLAST_GROW - D.BLAST_HOLD) / D.BLAST_SHRINK;
  return b.R * Math.max(0, 1 - u);
};
Engine.prototype.resize = function (W, H) {
  const sx = W / this.W, sy = H / this.H;
  for (const s of this.stars) { s.x *= sx; s.y *= sy; }
  for (const b of this.blasts) { b.x *= sx; b.y *= sy; }
  this.W = W; this.H = H;
};
Engine.prototype.step = function (dt) {
  if (this.over) return;
  const D = this.D;
  this.time += dt;
  // 星の移動（端で跳ね返る）
  for (const s of this.stars) {
    if (s.state === 'gone') continue;
    s.x += s.vx * dt; s.y += s.vy * dt;
    const r = s.d / 2;
    if (s.x < r) { s.x = r; s.vx = Math.abs(s.vx); } else if (s.x > this.W - r) { s.x = this.W - r; s.vx = -Math.abs(s.vx); }
    if (s.y < r) { s.y = r; s.vy = Math.abs(s.vy); } else if (s.y > this.H - r) { s.y = this.H - r; s.vy = -Math.abs(s.vy); }
  }
  // 輪の進行と当たり
  const total = D.BLAST_GROW + D.BLAST_HOLD + D.BLAST_SHRINK;
  for (let i = this.blasts.length - 1; i >= 0; i--) {
    const b = this.blasts[i];
    b.t += dt;
    if (b.t >= total) { this.blasts.splice(i, 1); continue; }
    if (b.t < D.BLAST_GROW + D.BLAST_HOLD) {
      const r = this.blastRadius(b);
      for (const s of this.stars) {
        if (s.state !== 'alive') continue;
        const dx = s.x - b.x, dy = s.y - b.y;
        if (dx * dx + dy * dy <= (r + s.d / 2) ** 2) { s.state = 'fuse'; s.fuse = D.FUSE; s.chain = b.chain + 1; }
      }
    }
  }
  // 導火線が尽きた星が爆発
  for (const s of this.stars) {
    if (s.state !== 'fuse') continue;
    s.fuse -= dt;
    if (s.fuse <= 0) {
      s.state = 'gone';
      this.cleared++; this.total++;
      this.chain = Math.max(this.chain, s.chain);
      this._blast(s.x, s.y, this.starBlastR(s.d), s.chain);
      this.events.push({ type: 'boom', x: s.x, y: s.y, d: s.d, kind: s.kind, chain: s.chain, cleared: this.cleared });
    }
  }
  // 収まったらステージ判定
  if (!this.busy()) {
    const aliveN = this.stars.filter(s => s.state === 'alive').length;
    if (this.cleared >= this.def.need || aliveN === 0) {
      if (!this._clearing) { this._clearing = true; this.events.push({ type: 'clear', index: this.stageIndex, cleared: this.cleared }); }
    } else if (this.taps <= 0) {
      this.over = true; this.events.push({ type: 'over' });
    }
  }
};
// クリア演出のあと呼ぶ（描画側が 1 秒待ってから）
Engine.prototype.nextStage = function () { this._clearing = false; this._startStage(this.stageIndex + 1); };
Engine.prototype.takeEvents = function () { const e = this.events; this.events = []; return e; };
if (typeof module !== 'undefined') module.exports = Engine;

// game.js — 描画・入力・音・画面遷移。engine.js の状態を描くだけ。
// 公開 API: RensaGame.mount(rootElement, {homeUrl}) / RensaGame.unmount()
const RensaGame = (function () {
  const D = DATA;
  const BAR = 56;
  const KEY_BEST = 'uchu.' + D.GAME_ID + '.best';
  const KEY_MUTE = 'uchu.' + D.GAME_ID + '.mute';
  const KEY_BGM = 'uchu.' + D.GAME_ID + '.bgm';

  let root = null, opts = {}, els = {}, ctx = null, engine = null;
  let raf = 0, lastT = 0, running = false, paused = false, started = false;
  let pointer = null, particles = [], floats = [], dots = [], flashes = [];
  let resetArmed = false, resetTimer = 0, clearTimer = 0, shake = 0, introTimer = 0;
  let dpr = 1, W = 0, H = 0, BH = 0;
  let listeners = [], imgs = {}, bannerTimer = null, lastChain = 0;

  function load(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ---------- 音 ----------
  const audio = { ac: null, muted: !!load(KEY_MUTE, false) };
  function ac() {
    if (!audio.ac) { try { audio.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio.ac = null; } }
    if (audio.ac && audio.ac.state === 'suspended') audio.ac.resume();
    return audio.ac;
  }
  function tone(freq, dur, type, vol, when) {
    const a = ac(); if (!a || audio.muted) return;
    const t = a.currentTime + (when || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, lp) {
    const a = ac(); if (!a || audio.muted) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp || 4000;
    const g = a.createGain(); g.gain.value = vol || 0.3;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  const sfx = {
    tap: () => { noise(0.2, 0.35, 1200); tone(110, 0.25, 'sine', 0.2); },
    boom: (chain) => { const f = 261.6 * Math.pow(2, Math.min(12, chain) / 12); tone(f, 0.18, 'triangle', 0.16); tone(f * 2, 0.1, 'sine', 0.06, 0.02); noise(0.06, 0.12, 3000); },
    clear: () => [523, 659, 784].forEach((f, i) => tone(f, 0.25, 'triangle', 0.18, i * 0.1)),
    over: () => { tone(330, 0.3, 'sine', 0.15); tone(220, 0.5, 'sine', 0.15, 0.25); },
    fanfare: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.2, i * 0.12)),
  };
  function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- BGM（宇宙らしく、ゆっくりしたパッド） ----------
  const bgm = { on: load(KEY_BGM, true) !== false, master: null, timer: null, nextT: 0, step: 0, playing: false, duck: 1 };
  const NOTE = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const BGM_STYLE = { bpm: 72, chords: [[57, 60, 64, 67], [53, 57, 60, 64], [60, 64, 67, 71], [55, 59, 62, 65]], bass: [45, 41, 48, 43] };
  function bgmGain() { const a = ac(); if (!a) return null; if (!bgm.master) { bgm.master = a.createGain(); bgm.master.gain.value = 0; bgm.master.connect(a.destination); } return bgm.master; }
  function bgmApplyVol() { const m = bgmGain(); if (m) m.gain.setTargetAtTime((audio.muted || !bgm.on) ? 0 : 0.14 * bgm.duck, audio.ac.currentTime, 0.25); }
  function bgmStart() { const a = ac(); if (!a || bgm.playing) return; bgmGain(); bgm.playing = true; bgm.nextT = a.currentTime + 0.1; bgm.step = 0; bgm.timer = setInterval(bgmSchedule, 80); bgmApplyVol(); }
  function bgmStop() { if (bgm.timer) clearInterval(bgm.timer); bgm.timer = null; bgm.playing = false; if (bgm.master && audio.ac) bgm.master.gain.setTargetAtTime(0, audio.ac.currentTime, 0.2); }
  function bgmSchedule() {
    const a = audio.ac; if (!a || !bgm.playing) return;
    const st = BGM_STYLE, beat = 60 / st.bpm, eighth = beat / 2;
    while (bgm.nextT < a.currentTime + 0.35) {
      const step = bgm.step, bar = Math.floor(step / 16) % st.chords.length, chord = st.chords[bar], t = bgm.nextT, m = bgm.master;
      if (step % 16 === 0) {

  // ---------- DOM ----------

    root.style.setProperty('--rs-accent', D.COLOR_ACCENT); root.style.setProperty('--rs-line', D.COLOR_LINE); root.style.setProperty('--rs-font', D.FONT);
    els.canvas = h('canvas', 'rs-canvas'); root.appendChild(els.canvas); ctx = els.canvas.getContext('2d');
    els.bar = h('div', 'rs-bar');
    els.left = h('div', 'rs-left'); els.dots = h('div', 'rs-dots'); els.stageLabel = h('div', 'rs-scene', ''); els.left.appendChild(els.dots); els.left.appendChild(els.stageLabel);

    els.right = h('div', 'rs-right');
    els.bgmBtn = h('button', 'rs-btn' + (bgm.on ? '' : ' rs-off'), '♪'); els.muteBtn = h('button', 'rs-btn', audio.muted ? '🔇' : '🔊'); els.pauseBtn = h('button', 'rs-btn', '❚❚');
    els.right.appendChild(els.bgmBtn); els.right.appendChild(els.muteBtn); els.right.appendChild(els.pauseBtn);
    els.bar.appendChild(els.left); els.bar.appendChild(els.scoreWrap); els.bar.appendChild(els.right); root.appendChild(els.bar);
    els.flash = h('div', 'rs-flash'); root.appendChild(els.flash);

  function resize() {

  }

  // ---------- 入力 ----------

  }
  function onCancel(e) { if (pointer && e.pointerId === pointer.id) pointer = null; }

  // ---------- 画面 ----------
  function overlay(inner, onTap) { closeOverlay(); els.overlay = h('div', 'rs-overlay'); const p = h('div', 'rs-panel'); els.overlay.appendChild(p); inner(p); root.appendChild(els.overlay); on(els.overlay, 'pointerdown', (e) => e.stopPropagation()); if (onTap) on(els.overlay, 'click', onTap); }
  function closeOverlay() { if (els.overlay) { els.overlay.remove(); els.overlay = null; } }
  function homeBtn(p) { if (!opts.homeUrl) return; const b = h('button', 'rs-ghost', 'ゲーム一覧へ'); on(b, 'click', (e) => { e.stopPropagation(); location.href = opts.homeUrl; }); p.appendChild(b); }
  function showTitle() {
    started = false;
    overlay((p) => {
      p.appendChild(h('h1', null, D.TITLE));
      p.appendChild(h('p', null, 'タップでスタート'));
      const best = load(KEY_BEST, null);
      if (best && best.stage > 0) p.appendChild(h('p', 'rs-sub', 'ベスト ステージ ' + best.stage + '（消した星 ' + best.total + '）'));
      const a = h('div', 'rs-actions'); homeBtn(a); if (a.children.length) p.appendChild(a);
    }, () => { ac(); startGame(); });
  }
  function startGame() {
    closeOverlay();
    engine.reset(); particles = []; floats = []; flashes = []; paused = false; started = true; resetArmed = false; clearTimer = 0;
    els.hint.style.display = '';

  }
  function togglePause(force) {

      overlay((p) => {
        p.appendChild(h('h2', null, '一時停止'));
        p.appendChild(h('p', null, 'ステージ ' + (engine.stageIndex + 1) + '　消した星 ' + engine.total));
        const a = h('div', 'rs-actions');
        const c = h('button', 'rs-cta', 'つづける'); on(c, 'click', () => togglePause()); a.appendChild(c);
        const r = h('button', 'rs-ghost', '最初から'); const w = h('div', 'rs-warn', '');
        on(r, 'click', () => { if (!resetArmed) { resetArmed = true; w.textContent = '今の記録は消えます。もう一度おすと最初から'; resetTimer = 3; } else { startGame(); } });
        a.appendChild(r); a.appendChild(w); homeBtn(a); p.appendChild(a);

  function updateBar() {

    els.banner.appendChild(h('div', 'rs-intro-big', big));

  // ---------- イベント ----------

  // ---------- 描画 ----------

  }

  // ---------- ループ ----------
  function frame(ts) {
