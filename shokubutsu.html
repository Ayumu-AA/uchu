<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>植物アドベンチャー</title>
<style>:root{color-scheme:dark}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style>
</head>
<body>
<style>
:root{
  --bg:#0f1712; --panel:#182319; --panel2:#213022; --line:#2f4432;
  --tx:#e8f0e8; --tx2:#98ab9a;
  --soil:#c9924a; --leaf:#5ccf7a; --phloem:#e9b64a; --water:#5ab8ff; --energy:#3fc4a0; --vp:#f2d13c;
  --ok:#4ade80; --ng:#f87171;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
html,body{height:100%; overscroll-behavior:none}
body{
  background:var(--bg); color:var(--tx);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:14px; line-height:1.5; user-select:none; -webkit-user-select:none;
}
button{font-family:inherit; cursor:pointer; border:none; color:inherit; background:none}

#app{height:100dvh; max-width:480px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; position:relative; background:var(--bg)}

/* ===== 上部バー ===== */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:8px 10px;
  background:linear-gradient(90deg,#1e3324,#182319); border-bottom:1px solid var(--line);
}
.tstat{background:#00000040; border:1px solid var(--line); border-radius:8px; padding:2px 8px; text-align:center; min-width:52px}
.tstat b{display:block; font-size:15px; line-height:1.25; font-variant-numeric:tabular-nums}
.tstat span{font-size:8.5px; color:var(--tx2); display:block; line-height:1.2}
.tstat .hpbar{height:4px; background:#00000060; border-radius:2px; overflow:hidden; margin-top:2px}
.tstat .hpbar i{display:block; height:100%; background:var(--ng); transition:width .3s}
#condchip{margin-left:auto; font-size:10px; color:var(--vp); background:#f2d13c14; border:1px solid #f2d13c44;
  border-radius:99px; padding:3px 7px; max-width:76px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tbtn{min-width:40px;min-height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:15px;font-weight:800;flex:0 0 auto}

/* ===== 植物の図 ===== */
#bodyarea{flex:1 1 auto; position:relative; min-height:0; display:flex; justify-content:center}
#bodywrap{position:relative; height:100%; aspect-ratio:300/500; max-width:100%; transition:background .6s;
  background:linear-gradient(180deg,#7cc4f5 0%,#c7e7fb 56%,#dcebc9 73.5%,#6b4a2a 74%,#4a3218 100%)}
#bodywrap.w-kumori{background:linear-gradient(180deg,#8fa1ae 0%,#c4cfd6 56%,#c9d3bd 73.5%,#5e4326 74%,#42301a 100%)}
#bodywrap.w-ame{background:linear-gradient(180deg,#5f7386 0%,#93a6b6 56%,#9fb09c 73.5%,#4e3a25 74%,#352816 100%)}
#bodywrap.w-atsui{background:linear-gradient(180deg,#ffb457 0%,#ffe0ad 56%,#e8dfb0 73.5%,#7a4f26 74%,#553516 100%)}
#bodywrap.night{background:linear-gradient(180deg,#05080f 0%,#0b1420 56%,#1a1810 73.5%,#221709 74%,#160f06 100%)}
#bodysvg .sun{fill:#ffd66b; filter:drop-shadow(0 0 10px #ffd66b)}
#bodysvg .cloud{fill:#ffffffd0}
#bodysvg .rain{stroke:#e0f0ffb0; stroke-width:2; stroke-linecap:round}
#skyfx>g{display:none}
#bodywrap.w-hare #sky-sun, #bodywrap.w-atsui #sky-sun{display:block}
#bodywrap.w-atsui #sky-sun .sun{fill:#ff9b3d; filter:drop-shadow(0 0 16px #ff9b3d)}
#bodywrap.w-kumori #sky-cloud, #bodywrap.w-ame #sky-cloud{display:block}
#bodywrap.w-ame #sky-rain{display:block}
#bodywrap.night #skyfx>g{display:none}
#bodysvg .leafs{transition:fill .6s}
#bodywrap.night .leafs{fill:#1d4a29}
#bodysvg{position:absolute; inset:0; width:100%; height:100%}
#bodysvg .stem{fill:none; stroke:#3f8a4a; stroke-width:9; stroke-linecap:round}
#bodysvg .leafs{fill:#2f7a3f; stroke:#6bd08a; stroke-width:1.5}
#bodysvg .root{fill:none; stroke:#c9b58a; stroke-width:4; stroke-linecap:round}
#bodysvg .rootf{fill:none; stroke:#c9b58a88; stroke-width:1.5}
#bodysvg .flower{fill:#f6a5c0; stroke:#ffd1e0; stroke-width:1}
#bodysvg .flowerc{fill:#f2d13c}
#bodysvg .soilline{fill:none; stroke:#5a3f22; stroke-width:2}
#bodysvg .vessel{fill:none; stroke:#5ab8ff55; stroke-width:4; stroke-linecap:round; stroke-dasharray:5 9}
#bodysvg .vessel2{fill:none; stroke:#e9b64a55; stroke-width:3; stroke-linecap:round; stroke-dasharray:4 8}
#bodywrap.flowing .vessel{animation:vflow .8s linear infinite}
#bodywrap.flowing .vessel2{animation:vflow2 1.1s linear infinite}
@keyframes vflow{to{stroke-dashoffset:-14}}
@keyframes vflow2{to{stroke-dashoffset:12}}
.flowchip{position:absolute; top:2px; left:2px; z-index:4; background:#0f2233ee; border:1px solid #5ab8ff66;
  border-radius:99px; padding:2px 10px; font-size:11px; color:#bfe2ff}
.flowchip b{font-size:14px; color:#fff}
#weatherchip{position:absolute; top:2px; left:50%; transform:translateX(-50%); z-index:4; background:#1a1f10ee; border:1px solid #f2d13c55;
  border-radius:99px; padding:2px 9px; font-size:11px; color:#ffe9a0; white-space:nowrap}
#weatherchip b{font-size:13px}

.onode{position:absolute; transform:translate(-50%,-50%); width:52px; min-height:46px; padding:3px 1px 2px;
  background:#213022f0; border:1px solid var(--line); border-radius:10px; text-align:center;
  transition:transform .14s,border-color .14s; z-index:3}
.onode .oico{font-size:17px; display:block; line-height:1.15; pointer-events:none}
.onode .olab{font-size:8px; color:var(--tx2); display:block; white-space:nowrap; pointer-events:none}
.onode .ocnt{position:absolute; top:-6px; right:-6px; background:var(--energy); color:#06231c;
  font-size:9px; font-weight:700; border-radius:99px; padding:0 4px; pointer-events:none}
.onode.spent{opacity:.35; filter:grayscale(.85)}
.onode.ghost{opacity:.34; border-style:dashed; background:#182319cc}
.onode.pulse{animation:opulse .5s}
@keyframes opulse{35%{transform:translate(-50%,-50%) scale(1.28); box-shadow:0 0 18px #3fc4a099; border-color:var(--energy)}}
.guide{outline:3px solid var(--vp) !important; outline-offset:3px; animation:gblink 1s infinite; z-index:6}
@keyframes gblink{50%{outline-color:#f2d13c22}}

/* 器官のヒント（ホバー／長押し） */
#otip{position:absolute; z-index:8; pointer-events:none; opacity:0; transition:opacity .15s; max-width:62%;
  background:#0f1712d9; border:1px solid #ffffff33; border-radius:9px; padding:5px 8px; font-size:9.5px; line-height:1.5; color:#dfe8df; backdrop-filter:blur(3px)}
#otip.on{opacity:1}
#otip b{color:#fff; font-size:10px; display:block; margin-bottom:1px}
#otip .in{color:#ffb4b4} #otip .out{color:#8fe6a8}
#otip .cost{color:#98ab9a}
.onode{-webkit-touch-callout:none}

/* 図の上のミニ数値パネル */
.miniz{position:absolute; z-index:2; background:#0f1712cc; border-radius:8px; padding:3px 6px;
  font-size:10px; line-height:1.55; pointer-events:none; backdrop-filter:blur(2px)}
.miniz .mrow{display:flex; justify-content:space-between; gap:6px; white-space:nowrap}
.miniz .mrow b{font-variant-numeric:tabular-nums}
.miniz .mrow.warn b{color:var(--ng)}
.miniz h4{font-size:8.5px; font-weight:700; letter-spacing:.06em; margin-bottom:1px}
.miniz.leaf{left:1%; top:7.5%; max-width:29%; border-left:2px solid var(--leaf)}
.miniz.leaf h4{color:#8fe6a8}
.miniz.phloem{right:1%; top:7.5%; max-width:29%; border-left:2px solid var(--phloem)}
.miniz.phloem h4{color:#ffd57a}
.miniz.soil{left:1%; bottom:2%; max-width:34%; border-left:2px solid var(--soil)}
.miniz.soil h4{color:#f0c58a}
.delta{font-size:9px; font-weight:700; margin-left:3px; display:inline-block; animation:drise 1.2s forwards}
.delta.up{color:var(--ok)} .delta.dn{color:var(--ng)}
@keyframes drise{0%{opacity:0; transform:translateY(4px)}18%{opacity:1}75%{opacity:1}100%{opacity:0; transform:translateY(-8px)}}

/* ===== 下部 ===== */
#guidebar{flex:0 0 auto; font-size:11.5px; padding:5px 12px; color:var(--vp); background:#26231433;
  border-top:1px solid #f2d13c33; text-align:center; min-height:28px}
#guidebar:empty{display:none}
#handrow{flex:0 0 auto; display:flex; gap:7px; overflow-x:auto; padding:8px 10px 4px; scrollbar-width:none}
#handrow::-webkit-scrollbar{display:none}
.hcard{flex:0 0 auto; width:96px; min-height:88px; background:linear-gradient(160deg,#243a2a,#1a2a1e);
  border:1px solid #3d5c44; border-radius:10px; padding:6px 7px; text-align:left; position:relative}
.hcard .ico{font-size:17px; line-height:1}
.hcard .nm{font-weight:700; font-size:11px; margin-top:2px}
.hcard .tx{font-size:8.5px; color:#c3dec8; line-height:1.35; margin-top:2px}
.hcard.pulse{animation:opulse .5s}
.hcard.bad{border-color:#7a3d3d; background:linear-gradient(160deg,#3a2424,#241a1a)}
.hcard.bad .tx{color:#ffb4b4}
#actrow{flex:0 0 auto; display:flex; gap:7px; padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.abtn{flex:1; min-height:46px; border-radius:11px; font-size:13px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line)}
.abtn:active{transform:scale(.97)}
.abtn.grow{background:linear-gradient(135deg,#f2d13c,#d9a92c); color:#332600}
.abtn.grow.dim{filter:grayscale(.6); opacity:.55}
.abtn.end{background:linear-gradient(135deg,#4a63c9,#2b3f9b); color:#eef}

/* ===== ボトムシート（ショップ） ===== */
#sheet{position:absolute; left:0; right:0; bottom:0; top:14%; z-index:40;
  background:var(--panel); border-radius:18px 18px 0 0; border:1px solid var(--line);
  transform:translateY(110%); transition:transform .28s cubic-bezier(.2,.8,.3,1);
  display:flex; flex-direction:column; box-shadow:0 -12px 40px #000a}
#sheet.on{transform:translateY(0)}
#sheet header{flex:0 0 auto; display:flex; align-items:center; padding:10px 14px 6px; gap:10px}
#sheet header h2{font-size:13px}
#sheet header .en{margin-left:auto; font-size:12px; color:var(--energy); font-weight:700}
#sheet .close{min-width:44px; min-height:38px; background:var(--panel2); border-radius:9px; font-size:12px}
#shoplist{flex:1; overflow-y:auto; padding:4px 12px 20px}
.scard{width:100%; margin-bottom:7px; background:linear-gradient(160deg,var(--panel2),#172219);
  border:1px solid var(--line); border-radius:10px; padding:8px 9px; text-align:left; position:relative; min-height:52px}
.scard .cost{position:absolute; top:8px; right:9px; background:var(--energy); color:#06231c;
  font-size:11px; font-weight:700; border-radius:99px; padding:1px 8px}
.scard .nm{font-weight:700; font-size:12.5px}
.scard .cat{font-size:9px; color:var(--tx2)}
.scard .tx{font-size:9.5px; color:#c3dec8; margin-top:2px; line-height:1.4}
.scard.cant{opacity:.4}
.shophead{font-size:10px; letter-spacing:.08em; color:var(--tx2); margin:10px 0 6px; padding-bottom:3px; border-bottom:1px solid var(--line)}

/* ===== オーバーレイ ===== */
.ovl{position:absolute; inset:0; z-index:60; background:#000000d6; display:none;
  align-items:center; justify-content:center; padding:22px; backdrop-filter:blur(4px)}
.ovl.on{display:flex}
.ovl .box{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px;
  width:100%; max-width:360px; max-height:86%; overflow-y:auto; text-align:center}
.ovl .box h2{font-size:17px; margin-bottom:8px}
.ovl .box p{font-size:12.5px; color:#ccdccf; margin-bottom:6px; text-align:left}
.ovl .box p.c{text-align:center}
.ovl .bigico{font-size:44px; line-height:1.2}
.ovl .dmgv{font-size:26px; font-weight:800; color:var(--ng)}
.ovl .btn{display:block; width:100%; min-height:48px; border-radius:12px; font-size:14px; font-weight:700;
  background:linear-gradient(135deg,#3fc4a0,#2b9b7d); color:#06231c; margin-top:10px}
.ovl .btn.sub{background:var(--panel2); color:var(--tx); border:1px solid var(--line)}
.ovl .btn.dis{opacity:.4; pointer-events:none}
.ovl .sci{background:#1a2b26; border-left:3px solid var(--energy); padding:7px 10px; border-radius:0 6px 6px 0;
  font-size:11px; margin:8px 0; text-align:left; color:#cfe8de}
.chainrow{background:#00000040; border:1px solid var(--line); border-radius:8px; padding:6px 9px; margin:5px 0;
  font-size:10.5px; text-align:left; line-height:1.5}
.chainrow b{color:var(--phloem)}
.lvbtn{display:flex; align-items:center; gap:12px; width:100%; background:var(--panel2); border:1px solid var(--line);
  border-radius:13px; padding:12px 14px; margin-top:10px; text-align:left; min-height:60px}
.lvbtn .lvname{font-size:15px; font-weight:800; min-width:5.2em}
.lvbtn .lvdesc{font-size:10.5px; color:var(--tx2); line-height:1.45}
.lvbtn.main{border-color:var(--energy); background:#12312a}
.lvbtn.dis{opacity:.38}
.lvbtn .best{color:var(--vp); font-weight:700}
.modetabs{display:flex; gap:6px; margin:10px 0 2px}
.modetab{flex:1; min-height:44px; border-radius:11px; font-size:12.5px; font-weight:700;
  background:var(--panel2); border:1px solid var(--line); color:var(--tx2)}
.modetab.on{background:#12312a; border-color:var(--energy); color:var(--tx)}
#tutbub{position:absolute; left:8px; right:8px; bottom:158px; z-index:55;
  background:linear-gradient(160deg,#1c3a31,#132921); border:1px solid var(--energy); border-radius:13px;
  padding:10px 12px; font-size:12.5px; line-height:1.6; box-shadow:0 10px 30px #000c}
#tutbub.attop{bottom:auto; top:64px}
#tutbub.mini{left:8px; right:auto; bottom:158px; top:auto; padding:0; background:none; border:none; box-shadow:none}
#tutbub.mini .minichip{min-height:44px; display:flex; align-items:center; gap:6px; padding:0 14px;
  background:linear-gradient(160deg,#1c3a31,#132921); border:1px solid var(--energy); border-radius:99px;
  font-size:12px; font-weight:700; box-shadow:0 6px 20px #000a}
#tutbub .tstep{font-size:9px; color:var(--energy); letter-spacing:.08em; margin-bottom:2px}
#tutbub .tacts{display:flex; gap:8px; margin-top:8px; justify-content:flex-end}
#tutbub .tbtn2{min-height:40px; padding:0 16px; border-radius:10px; font-size:12px; font-weight:700;
  background:linear-gradient(135deg,#3fc4a0,#2b9b7d); color:#06231c}
#tutbub .tbtn2.sub{background:var(--panel2); color:var(--tx2); border:1px solid var(--line)}

/* 防いだバナー */
#banner{opacity:0; position:absolute; top:8px; left:50%; transform:translateX(-50%) translateY(-140%); z-index:70;
  background:#173327f0; border:1px solid var(--ok); color:#d9ffe8; border-radius:12px; padding:9px 16px;
  font-size:12px; white-space:nowrap; transition:transform .25s; pointer-events:none; max-width:92%}
#banner.on{transform:translateX(-50%) translateY(0); opacity:1}

/* 夜のフェード */
#nightovl{position:absolute; inset:0; z-index:50; background:#03060c; opacity:0; pointer-events:none; transition:opacity .35s;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:#dfe7ff; font-size:13px}
#nightovl.on{opacity:.93; pointer-events:auto}
#nightovl .moon{font-size:44px}
#nightovl .nl{font-size:11.5px; color:#b9c4e8; max-width:80%; text-align:center; line-height:1.6}

/* トースト・パーティクル */
.toast{position:fixed; z-index:130; pointer-events:none; background:#3b1d24; border:1px solid #f8717166;
  color:#ffd7d7; font-size:11px; padding:4px 10px; border-radius:8px; transform:translate(-50%,-120%);
  white-space:nowrap; animation:tfade 1.7s forwards}
@keyframes tfade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0; margin-top:-12px}}
.particle{position:fixed; z-index:130; pointer-events:none; font-size:16px;
  transition:transform .7s cubic-bezier(.2,.7,.3,1), opacity .7s; will-change:transform}
.shake{animation:shake .3s 2}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.statflash{animation:sflash .6s}
@keyframes sflash{35%{background:#3fc4a044; border-color:var(--energy)}}
.hpflash{animation:hflash .6s 2}
@keyframes hflash{35%{background:#f8717155; border-color:var(--ng)}}
</style>
<div id="app">
  <div id="topbar">
    <div class="tstat" id="stat-turn"><b>1</b><span>日目</span></div>
    <div class="tstat" id="stat-hp"><b style="color:#f87171">20</b><span>元気</span><div class="hpbar"><i></i></div></div>
    <div class="tstat" id="stat-energy"><b style="color:#3fc4a0">0</b><span>エネルギー</span></div>
    <div class="tstat" id="stat-vp"><b style="color:#f2d13c">0</b><span>スコア</span></div>
    <div id="condchip" hidden></div>
    <button id="rulebtn" class="tbtn">？</button>
    <button id="menubtn" class="tbtn">☰</button>
  </div>
  <div id="bodyarea">
    <div id="bodywrap">
      <svg id="bodysvg" viewBox="0 0 300 500" preserveAspectRatio="xMidYMid meet">
        <g id="skyfx">
          <g id="sky-sun"><circle class="sun" cx="252" cy="44" r="18"/></g>
          <g id="sky-cloud">
            <ellipse class="cloud" cx="235" cy="48" rx="34" ry="13"/><ellipse class="cloud" cx="222" cy="38" rx="18" ry="14"/><ellipse class="cloud" cx="250" cy="36" rx="20" ry="15"/>
            <ellipse class="cloud" cx="70" cy="30" rx="26" ry="10"/><ellipse class="cloud" cx="78" cy="22" rx="14" ry="11"/>
          </g>
          <g id="sky-rain"><path class="rain" d="M40 90 l-4 12 M90 70 l-4 12 M140 100 l-4 12 M190 80 l-4 12 M240 110 l-4 12 M270 70 l-4 12 M20 150 l-4 12 M110 160 l-4 12 M210 170 l-4 12 M280 190 l-4 12 M60 230 l-4 12 M250 250 l-4 12"/></g>
        </g>
        <path class="soilline" d="M0 372 C 40 366 70 378 110 372 S 190 366 230 373 S 280 368 300 372"/>
        <!-- 根 -->
        <path class="root" d="M150 372 C 148 400 140 420 118 445 C 108 456 100 466 96 478"/>
        <path class="root" d="M150 372 C 152 405 160 425 182 448 C 192 458 200 468 206 476"/>
        <path class="root" d="M150 372 C 150 410 150 440 152 486"/>
        <path class="rootf" d="M130 420 l-12 -6 M136 432 l-13 -3 M126 446 l-12 2 M168 424 l12 -6 M174 438 l13 -2 M184 452 l12 3 M150 430 l-10 -8 M150 452 l11 -7 M150 470 l-10 -6"/>
        <!-- 茎 -->
        <path class="stem" d="M150 372 C 150 300 150 200 150 96"/>
        <!-- 葉 -->
        <path class="leafs" d="M148 300 C 110 305 80 290 66 258 C 100 250 135 268 148 300 Z"/>
        <path class="leafs" d="M152 245 C 190 250 222 235 236 202 C 202 195 166 213 152 245 Z"/>
        <path class="leafs" d="M148 190 C 112 192 86 178 74 148 C 108 142 138 158 148 190 Z"/>
        <path class="leafs" d="M152 140 C 186 142 212 128 224 100 C 190 94 162 110 152 140 Z"/>
        <!-- 道管（上り）と師管（下り） -->
        <path class="vessel" d="M146 372 C 146 300 146 200 146 110"/>
        <path class="vessel2" d="M154 110 C 154 200 154 300 154 372"/>
        <!-- 花 -->
        <g id="flowerg">
          <circle class="flower" cx="150" cy="62" r="12"/><circle class="flower" cx="172" cy="78" r="12"/>
          <circle class="flower" cx="164" cy="103" r="12"/><circle class="flower" cx="136" cy="103" r="12"/>
          <circle class="flower" cx="128" cy="78" r="12"/><circle class="flowerc" cx="150" cy="84" r="10"/>
        </g>
      </svg>
      <div class="flowchip">💧 <b id="flowbig">0</b><span id="flowdelta"></span></div>
      <div id="weatherchip"></div>
      <div class="miniz leaf" id="zone-leaf"></div>
      <div class="miniz phloem" id="zone-phloem"></div>
      <div class="miniz soil" id="zone-soil"></div>
      <div id="nodes"></div>
      <div id="otip"></div>
    </div>
    <div id="banner"></div>
    <div id="nightovl"><div class="moon">🌙</div><div id="nighttext" class="nl"></div></div>
  </div>
  <div id="guidebar"></div>
  <div id="handrow"></div>
  <div id="actrow">
    <button class="abtn" id="shopbtn">🛒 器官を買う</button>
    <button class="abtn grow dim" id="grow">🌱 成長</button>
    <button class="abtn end" id="endturn">夜にする 🌙</button>
  </div>

  <div id="sheet">
    <header><h2>手に入れる</h2><span class="en" id="sheeten"></span><button class="close" id="sheetclose">とじる</button></header>
    <div id="shoplist"></div>
  </div>

function waterLimit(G){ return CFG.waterBase + G.board.filter(o=>o.id==='kuki').length*CFG.waterPerStem; }
function waterCheck(G,need){
  if(!CFG.hard) return null;
  const lim=waterLimit(G);
  if(G.waterUsed+need>lim) return F(`道管が運べる水をこえている（きょう ${G.waterUsed}/${lim}）。🪵茎をふやそう`);
  return null;
}

/* 水を使う（道管の水が足りなければ失敗） */
function useWater(G,n,hint){
  if(G.water<n) return F(`道管の水が足りない（${n}必要。🌱根毛で吸い上げよう）`);
  const lim=waterCheck(G,n); if(lim) return lim;
  G.water-=n; G.waterUsed+=n; return null;
}

  const tbl = w || WEATHER_W.normal;

}

/* 朝：天気カードをめくる */
function morning(forceId){
  const w = forceId ? WEATHER[forceId] : pickWeather(CFG.weatherW);
  G.weather=w.id; G.hot=w.hot; G.soil.light=w.light;
  if(w.soil){ G.soil.water+=w.soil; }
  say('m',`${w.ico} きょうは${w.name}：光${w.light}${w.soil?`／土の水+${w.soil}`:''}${w.hot?'／蒸散2倍':''}`);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function draw(n){
  for(let i=0;i<n;i++){
    if(!G.deck.length){
      if(!G.discard.length) break;
      G.deck = shuffle(G.discard); G.discard = [];
      say('m','捨て札をきりなおして山札にした');
    }
    G.hand.push(G.deck.pop());
  }
}
function say(cls,msg){ G.log.unshift({cls,msg:`[${G.turn}] ${msg}`}); if(G.log.length>150) G.log.pop(); }
function has(id){ return G.board.some(o=>o.id===id); }
function countOrgan(id){ return G.board.filter(o=>o.id===id).length; }
/* 今夜の呼吸で使う糖（葉緑体の数、最低1。剪定でへる） */
function nightCost(){ return Math.max(0, Math.max(1,countOrgan('youryokutai')) - G.prune); }

/* ============================================================
   エフェクト（実DOMがある時だけ動く）
   ============================================================ */
function isDom(el){ return el && typeof el.getBoundingClientRect==='function'; }
function toast(el,msg){
  if(!isDom(el) || typeof document.createElement!=='function') return;
  const r=el.getBoundingClientRect();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  t.style.left=(r.left+r.width/2)+'px'; t.style.top=r.top+'px';
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}
function fx(fromEl,toEl,emoji,n){
  if(!isDom(fromEl)||!isDom(toEl)) return;
  const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const cnt=Math.min(n||1,5);
  for(let i=0;i<cnt;i++){
    const p=document.createElement('div'); p.className='particle'; p.textContent=emoji;
    p.style.left=(a.left+a.width/2-9)+'px'; p.style.top=(a.top+a.height/2-9)+'px';
    document.body.appendChild(p);
    const dx=b.left+b.width/2-(a.left+a.width/2)+(Math.random()*36-18);
    const dy=b.top+b.height/2-(a.top+a.height/2)+(Math.random()*24-12);
    setTimeout(()=>{ p.style.transform=`translate(${dx}px,${dy}px) scale(.55)`; p.style.opacity='0'; }, 40+i*110);
    setTimeout(()=>p.remove(), 1050+i*110);
  }
}
function pulse(el){ if(!isDom(el)) return; el.classList.add('pulse'); setTimeout(()=>el.classList&&el.classList.remove('pulse'),600); }
function flashStat(id){
  if(typeof document.querySelector!=='function') return;
  const el=document.getElementById(id);
  if(el&&el.classList){ el.classList.add('statflash'); setTimeout(()=>el.classList.remove('statflash'),700); }
}
const FX_TGT={根:'zone-soil', 茎:'flowchip', 葉:'zone-leaf', 運ぶ:'zone-phloem', 呼吸:'stat-energy', 花:'stat-vp',
  水:'zone-soil', 光:'zone-soil', 養分:'stat-hp', 手入れ:'zone-leaf', 成長:'stat-vp'};
const FX_ICO={根:'💧', 茎:'💧', 葉:'✨', 運ぶ:'🍯', 呼吸:'⚡', 花:'🌸', 水:'💧', 光:'☀️', 養分:'🧪', 手入れ:'✂️', 成長:'🌱'};
function fxFor(cat,srcEl,ico,n){
  const tgt=document.getElementById(FX_TGT[cat]||'zone-leaf');
  fx(srcEl,tgt,FX_ICO[cat]||ico,n||3);
  if(cat==='呼吸'){ fx(srcEl,document.getElementById('zone-leaf'),'💨',2); flashStat('stat-energy'); }
}

/* ============================================================
   操作
   ============================================================ */
function useOrgan(i,el){
  if(G.over) return;
  const o=G.board[i], c=DB[o.id];
  if(o.used){ toast(el,'きょうはもう使った'); return; }
  const r=c.act(G);
  if(!r.ok){ say('r',`${c.name}：${r.msg}`); toast(el,r.msg); render(); return; }
  o.used=true; G.learned.add(o.id);
  say('g',`${c.ico} ${c.name} → ${r.msg}`);
  pulse(el); fxFor(c.cat,el,c.ico,3);
  tutEvent('organ',o.id);
  if(G.vp>=CFG.goalVP) return finish(true);
  render();
}
function useOrganById(id,el){
  if(G.over) return;
  if(!has(id)){ showCard(id,true); return; }
  const i=G.board.findIndex(o=>o.id===id&&!o.used);
  if(i<0){ toast(el,'きょうはもう使った'); return; }
  useOrgan(i,el);
}
function playCard(idx,el){
  if(G.over) return;
  if(G.plays<=0){ toast(el,`世話カードは1日${CFG.playLimit}枚まで`); return; }
  const id=G.hand[idx], c=DB[id];
  const r=c.act(G);
  if(!r.ok){ say('r',`${c.name}：${r.msg}`); toast(el,r.msg); render(); return; }
  G.hand.splice(idx,1); G.discard.push(id); G.plays--; G.learned.add(id);
  say('g',`${c.ico} ${c.name} → ${r.msg}`);
  pulse(el); fxFor(c.cat,el,c.ico,3);
  tutEvent('care',id);
  if(G.vp>=CFG.goalVP) return finish(true);
  render();
}
function buy(id,el){
  if(G.over) return;
  const c=DB[id];
  if(G.buys<=0){ toast(el,`1日に手に入れられるのは${CFG.buysPerTurn}枚まで`); return; }
  if(G.energy<c.cost){ toast(el,`エネルギーが足りない（${c.cost}必要）`); return; }
  G.energy-=c.cost; G.buys--;
  if(c.kind==='organ'){
    G.board.push({id,used:false});
    say('y',`${c.ico} ${c.name} が植物に加わった（今すぐ使える）`);
    fx(el,document.getElementById('bodywrap'),c.ico,1);
  } else {
    G.discard.push(id);
    say('y',`${c.ico} ${c.name} を山札に加えた`);
    fx(el,document.getElementById('handrow'),c.ico,1);
  }
  tutEvent('buy',id);
  render();
}
function grow(el){
  if(G.over) return;
  if(G.energy<CFG.vpCost){ toast(el,`エネルギーが足りない（${CFG.vpCost}必要）`); return; }
  G.energy-=CFG.vpCost; G.vp++;
  say('y',`植物が成長した：★ ${G.vp}／${CFG.goalVP}`);
  fx(document.getElementById('stat-energy'),document.getElementById('stat-vp'),'🌱',3);
  flashStat('stat-vp');
  tutEvent('grow');
  if(G.vp>=CFG.goalVP) return finish(true);
  render();
}

/* 夜：自動で進む */
function endTurn(){
  if(G.over) return;
  if(HOOKS.beforeDamage) HOOKS.beforeDamage(G);
  if(G.over) return;
  let dmg=0, why=[], night=[];

  /* 1. 夜の呼吸（たくわえ→糖の順に使う） */
  let need=nightCost(), used=0;
  const fromStore=Math.min(need,G.store); G.store-=fromStore; need-=fromStore; used+=fromStore;
  const fromSugar=Math.min(need,G.phloem.sugar); G.phloem.sugar-=fromSugar; need-=fromSugar; used+=fromSugar;
  if(used) night.push(`夜の呼吸で糖${used}を使った`);
  if(need>0){ const d=need*2; dmg+=d; why.push(`夜の呼吸の糖が${need}足りない（-${d}）葉が多すぎるか、糖を運べていない`); }

  /* 2. 土の水 */
  const w=WEATHER[G.weather];
  if(w&&w.evap&&!G.mulch){ const d=Math.min(w.evap,G.soil.water); G.soil.water-=d; if(d) night.push(`暑さで土の水-${d}`); }
  if(G.soil.water<=0){ dmg+=2; why.push('土がからからにかわいた（-2）🚰水やりか🥕根で水を'); }

  /* 3. 道管の水は蒸散で出ていく／光は消える */
  if(G.water>0) night.push(`道管に残った水${G.water}は蒸散で出ていった`);
  G.water=0; G.soil.light=0;

  if(dmg){
    G.hp-=dmg; say('r','弱った：'+why.join('／'));
    if(HOOKS.damage) HOOKS.damage(dmg,why);
    const app=document.getElementById('app');
    if(app&&app.classList){ app.classList.add('shake'); setTimeout(()=>app.classList.remove('shake'),700); }
  }
  if(night.length) say('m','🌙 '+night.join('／'));
  G.history.push({t:G.turn, e:G.energy, vp:G.vp, hp:G.hp});
  G.discard.push(...G.hand); G.hand=[];

  if(G.hp<=0) return finish(false,'元気が0になった。糖か水が足りなかった。');
  if(G.turn>=CFG.maxTurn) return finish(false,`${CFG.maxTurn}日で★が目標に届かなかった（${G.vp}／${CFG.goalVP}）`);

  G.turn++; G.waterUsed=0; G.transp=0; G.plays=CFG.playLimit; G.buys=CFG.buysPerTurn;
  G.made=0; G.moved=0; G.prune=0; G.pollen=false; G.mulch=false;
  G.board.forEach(o=>o.used=false);
  draw(CFG.handSize);
  morning();

  if(G.turn>=CFG.eventFrom && Math.random()<CFG.eventRate){
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    if(ev.guard && has(ev.guard)){ say('g',`${ev.ico} ${ev.name}：${ev.guardMsg}`); if(HOOKS.guard) HOOKS.guard(ev); }
    else {
      if(ev.effect) ev.effect(G,CFG.hard);
      const d = CFG.hard ? (ev.hardDmg||ev.dmg) : ev.dmg;
      if(d){ G.hp-=d; say('r',`${ev.ico} ${ev.name}：${ev.msg}（元気-${d}）`); }
      else say('r',`${ev.ico} ${ev.name}：${ev.msg}`);
      if(HOOKS.event) HOOKS.event(ev, d||0);
      if(G.hp<=0) return finish(false,'元気が0になった。虫や風への備えが足りなかった。');
    }
  }
  if(HOOKS.morning) HOOKS.morning(WEATHER[G.weather]);
  tutEvent('end');
  render();
}
function finish(win,reason){ G.over=true; render(); showResult(win,reason); }

/* 数値の増減フロート（PC/スマホ共通） */
function delta(cur,key,invert){
  if(!PREV) return '';
  const old=key.split('.').reduce((o,k)=>o&&o[k],PREV);
  if(old===undefined||old===cur) return '';
  const d=cur-old;
  const good = invert ? d<0 : d>0;
  return `<span class="delta ${good?'up':'dn'}">${d>0?'+':''}${d}</span>`;
}

function startTutorial(){
  TUT=null; removeTutBub();
  LEVEL=SP_LEVELS.easy; MODE='score'; GUIDE=null;
  Object.assign(CFG,{ goalVP:9999, startHP:20, playLimit:2, buysPerTurn:2, vpCost:3 }, LEVEL.cfg);
  CFG.maxTurn=3; CFG.eventFrom=99; CFG.eventRate=0; CFG.startEnergy=6; CFG.firstWeather='hare'; CFG.weatherW={hare:1};
  CFG.startOrgans=['konmou','kikou','youryokutai','shikan','saibou'];
  COND=CONDS[0];
  newGame();
  /* 山札を固定：2日目に水やりが必ず来る */
  G.deck=['hinata','hiryou','hikage','sentei','mizuyari','hinata','hiryou','hinata','mizuyari','mizuyari','mizuyari','hikage'].reverse();
  G.hand=[]; draw(CFG.handSize);
  TUT={i:0};
  render(); tutShow();
}
function removeTutBub(){
  if(typeof document.querySelector!=='function') return;
  const b=document.getElementById('tutbub'); if(b) b.remove();
}
function tutNext(){ if(!TUT) return; TUT.i++; TUT.min=false; if(typeof document.querySelector==='function'){ render(); tutShow(); } }
function tutMin(v){ if(!TUT) return; TUT.min=v; tutShow(); }
function tutShow(){
  if(typeof document.createElement!=='function') return;
  if(!TUT||TUT.i>=TUTSTEPS.length){ removeTutBub(); return; }
  const st=TUTSTEPS[TUT.i];
  let b=document.getElementById('tutbub');
  if(!b){ b=document.createElement('div'); b.id='tutbub'; document.getElementById('app').appendChild(b); }
  if(TUT.min){
    b.className='mini';
    b.innerHTML=`<button class="minichip" onclick="tutMin(false)">📖 せつめい ${TUT.i+1}/${TUTSTEPS.length}</button>`;
    return;
  }
  b.className = st.top ? 'attop' : '';
  b.innerHTML=`<div class="tstep">チュートリアル ${TUT.i+1} / ${TUTSTEPS.length}</div>
    <div>${st.t}</div>
    <div class="tacts">
      <button class="tbtn2 sub" onclick="tutMin(true)" style="margin-right:auto">▼ 小さくする</button>
      ${st.btn?`<button class="tbtn2" onclick="tutNext()">つぎへ</button>`:''}
      <button class="tbtn2 sub" onclick="TUT=null;removeTutBub();guideApply();">スキップ</button>
    </div>`;
}

function tutEvent(kind,id){
  if(TUT){
    const st=TUTSTEPS[TUT.i];
    if(!st||!st.wait) return;
    const [k,v]=st.wait;
    if(k!==kind) return;
    if(v && v!==id) return;
    TUT.i++; TUT.min=false;
    if(typeof document.querySelector==='function'){ tutShow(); guideApply(); }
    return;
  }
  if(!GUIDE||!GUIDE.on) return;
  const st=GSTEPS[GUIDE.i];
  if(!st||!st.wait) return;
  const [k,v]=st.wait;
  if(k!==kind) return;
  if(v && v!==id) return;
  GUIDE.i++;
  if(GUIDE.i>=GSTEPS.length || (st.last)) GUIDE.on=false;
  if(typeof document.querySelector==='function') render();
}
function guideApply(){
  if(typeof document.querySelectorAll!=='function') return;
  document.querySelectorAll('.guide').forEach(e=>e.classList.remove('guide'));
  if(TUT){
    const gb0=$id('guidebar'); if(gb0) gb0.innerHTML='';
    const st=TUTSTEPS[TUT.i];
    if(st&&st.sel){ const el=document.querySelector(st.sel); if(el) el.classList.add('guide'); }
    return;
  }
  const gb=$id('guidebar');
  if(!GUIDE||!GUIDE.on||G.over){ if(gb) gb.innerHTML=warnHint(); return; }
  const st=GSTEPS[GUIDE.i];
  if(!st){ gb.innerHTML=warnHint(); return; }
  gb.innerHTML=st.t;
  if(st.sel){ const el=document.querySelector(st.sel); if(el) el.classList.add('guide'); }
}
function warnHint(){
  if(!G) return '';
  const nc=nightCost();
  if(CFG.hard && G.waterUsed>=waterLimit(G) && G.board.some(o=>!o.used&&DB[o.id].water))
    return `⚠️ 道管が運べる水を使いきった（${G.waterUsed}/${waterLimit(G)}）。🪵茎で+${CFG.waterPerStem}できる`;
  if(CFG.hard && G.turn>=CFG.eventFrom && !has('toge') && !has('kuki'))
    return '⚠️ 虫・強風は元気-6！ 🌵トゲ・🪵茎で無効化できる（🛒）';
  if(G.soil.water<=0) return '⚠️ 土の水が0！ 🚰水やりをしないと夜に元気がへる';
  if(G.phloem.sugar+G.store < nc) return `⚠️ 今夜の呼吸で糖${nc}が要る（今${G.phloem.sugar}）。🍯師管で運ぶか✂️剪定を`;
  if(G.leaf.starch>0 && G.board.some(o=>o.id==='shikan'&&!o.used)) return '💡 葉にデンプンが残っている。🍯師管で糖に変えて運ぼう';
  if(G.leaf.starch>0 && !G.board.some(o=>o.id==='shikan'&&!o.used)) return '💡 デンプンが運びきれない。🍯師管をふやすと🌙ボーナスがねらえる';
  if(G.hot && G.water<2 && G.board.some(o=>!o.used&&DB[o.id].water)) return '🔥 暑い日は蒸散2倍。⛱️日かげに移す か🌱根毛をふやそう';
  if(G.energy>=CFG.vpCost) return `🌱 エネルギー${G.energy}！「成長」でスコアにできる`;
  return '';
}

  const b=$id('banner'); if(!b) return;

let NIGHT=false;
function endDay(){
  if(!G||G.over||NIGHT) return;
  NIGHT=true;
  const no=$id('nightovl'), nt=$id('nighttext'), bw=$id('bodywrap');
  const before=G.log.length;
  if(no){ no.classList.add('on'); nt.textContent='夜になった。植物は光合成をやめて、呼吸だけを続けている…'; }
  if(bw) bw.classList.add('night');
  setTimeout(()=>{
    endTurn();
    const added=G.log.length-before;
    const lines=G.log.slice(0,added).map(l=>l.msg.replace(/^\[\d+\] /,'')).filter(m=>m.startsWith('🌙')||m.startsWith('弱った')||m.startsWith('🌙 デンプン')).reverse();
    if(nt) nt.textContent=lines.join('　') || '静かな夜だった';
  },500);
  setTimeout(()=>{
    if(no) no.classList.remove('on');
    if(bw) bw.classList.remove('night');
    NIGHT=false;
    if(MORNING_MSG && !G.over){ banner(MORNING_MSG); } MORNING_MSG=null;
  },1900);
}

  vib(cleared?[60,40,60,40,150]:[200,80,200]);
}

/* ---------- 勉強用：植物のくわしい解説 ---------- */
function showStudy(){
  ovl(`<h2>📖 植物の体のつくりとはたらき</h2>
  <p class="c" style="color:#98ab9a;font-size:11px">中1理科「植物の体のつくりとはたらき」対応</p>

  <div class="chainrow" style="border-color:#5ccf7a66"><b style="color:#8fe6a8">🍃 光合成</b><br>
  <b>水 ＋ 二酸化炭素 →（光）→ デンプンなど ＋ 酸素</b><br>
  葉の細胞の<b>葉緑体</b>で行われる。光が必要。<br>
  <span style="color:#98ab9a;font-size:10px">実験：葉を<b>エタノール</b>で脱色し<b>ヨウ素液</b>をかけると、光が当たった緑の部分だけ青むらさき色（デンプンあり）。ふ（白い部分）や<b>アルミはく</b>でおおった部分にはできない。</span></div>

  <div class="chainrow" style="border-color:#3fc4a066"><b style="color:#7fe0c3">⚡ 呼吸</b><br>
  <b>養分 ＋ 酸素 → エネルギー ＋ 二酸化炭素 ＋ 水</b><br>
  植物も<b>昼も夜も</b>呼吸している。昼は光合成のほうが多いので、全体では二酸化炭素をとり入れ酸素を出しているように見える。<br>
  <span style="color:#98ab9a;font-size:10px">実験：暗い袋に入れた植物と息を<b>石灰水</b>に通すと白くにごる（二酸化炭素）。</span></div>

  <div class="chainrow" style="border-color:#5ab8ff66"><b style="color:#bfe2ff">💧 蒸散と水の通り道</b><br>
  根の<b>根毛</b>（表面積を大きくする）で水を吸う → <b>道管</b>を通って上へ → 葉の<b>気孔</b>から水蒸気として出る（<b>蒸散</b>）。蒸散が水を引き上げる力になる。<br>
  気孔は<b>葉の裏側に多い</b>。2つの<b>孔辺細胞</b>にはさまれたすきま。<br>
  <span style="color:#98ab9a;font-size:10px">実験：葉の表・裏に<b>ワセリン</b>をぬって水のへり方をくらべる。裏をふさぐと水がへりにくい＝気孔は裏に多い。</span></div>

  <div class="chainrow" style="border-color:#e9b64a66"><b style="color:#ffd57a">🍯 養分の通り道</b><br>
  葉でできた<b>デンプンは水にとけにくい</b>ので、<b>水にとけやすい物質（糖）</b>に変えられてから<b>師管</b>で全身へ運ばれる。体の各部で使われたり、デンプンにもどして根や実に<b>たくわえ</b>られたりする。<br>
  <b>維管束</b>＝道管（内側）＋師管（外側）の束。双子葉類は<b>輪状</b>、単子葉類は<b>散らばる</b>。葉では葉脈になる（網状脈／平行脈）。</div>

  <div class="chainrow" style="border-color:#f6a5c066"><b style="color:#ffc4d6">🌸 花のつくり</b><br>
  外側から <b>がく → 花弁 → おしべ → めしべ</b>。おしべの<b>やく</b>の花粉がめしべの<b>柱頭</b>につく＝<b>受粉</b>。受粉するとめしべのもとの<b>子房→果実</b>、中の<b>胚珠→種子</b>になる。<br>
  胚珠が子房に包まれている＝<b>被子植物</b>、むき出し＝<b>裸子植物</b>（マツ・イチョウ・スギ）。</div>

/* ---------- ショップ（ボトムシート） ---------- */
function openSheet(){ renderSheet(); $id('sheet').classList.add('on'); tutEvent('buy','open'); }
function closeSheet(){ const s=$id('sheet'); if(s) s.classList.remove('on'); tutEvent('sheetclose'); }
function renderSheet(){
  const card=id=>{
    const c=DB[id], can=G.energy>=c.cost&&G.buys>0;
    const owned=c.kind==='organ'?G.board.filter(o=>o.id===id).length:0;
    return `<button class="scard ${can?'':'cant'}" onclick="buy('${id}',this);renderSheet();">
      <div class="cost">${c.cost}</div>
      <div class="nm">${c.ico} ${c.name}${owned?` <span style="color:var(--energy)">×${owned}</span>`:''} <span class="cat">${c.cat}</span></div>
      <div class="tx">${c.text}</div></button>`;

  $id('shoplist').innerHTML =

/* ---------- 描画 ---------- */
const SP_LAB={konmou:'根毛',ne:'根',kuki:'茎',toge:'トゲ',kikou:'気孔',youryokutai:'葉緑体',shikan:'師管',saibou:'細胞',choZou:'いも',hana:'花'};
const SP_POS={
  hana:[50,12], youryokutai:[74,27], kikou:[26,34], shikan:[50,41], saibou:[74,50],
  toge:[26,58], kuki:[50,60], ne:[28,80], konmou:[50,89], choZou:[72,84],
};
function render(){
  if(typeof document.querySelector!=='function' || !G) return;
  const set=(id,html)=>{ const e=$id(id); if(e) e.innerHTML=html; };

  set('stat-turn',`<b>${G.turn}<span style="font-size:10px;color:#98ab9a">/${CFG.maxTurn}</span></b><span>日目</span>`);
  set('stat-hp',`<b style="color:#f87171">${Math.max(0,G.hp)}${delta(G.hp,'hp')}</b><span>元気</span><div class="hpbar"><i style="width:${Math.max(0,G.hp/CFG.startHP*100)}%"></i></div>`);
  set('stat-energy',`<b style="color:#3fc4a0">${G.energy}${delta(G.energy,'energy')}</b><span>エネルギー</span>`);
  if(MODE==='clear'){
    set('stat-vp',`<b style="color:#f2d13c">★${G.vp}<span style="font-size:10px;color:#98ab9a">/${CFG.goalVP}</span>${delta(G.vp,'vp')}</b><span>もくひょう</span>`);
  } else {
    const best=load(bestKey());
    set('stat-vp',`<b style="color:#f2d13c">★${G.vp}${delta(G.vp,'vp')}</b><span>${best!=null?`ベスト★${best}`:'スコア'}</span>`);
  }
  const cc=$id('condchip'); if(cc&&COND){ cc.hidden=false; cc.textContent=`${COND.ico} ${COND.name}`; }

  $id('flowbig').textContent=G.water;
  set('flowdelta',delta(G.water,'water')+(CFG.hard?`<span style="font-size:9px;color:#98ab9a"> ${G.waterUsed}/${waterLimit(G)}</span>`:''));
  const bw=$id('bodywrap'); if(bw&&bw.classList){ G.water>0?bw.classList.add('flowing'):bw.classList.remove('flowing');
    ['w-hare','w-kumori','w-ame','w-atsui'].forEach(c=>bw.classList.remove(c)); if(G.weather) bw.classList.add('w-'+G.weather); }
  const w=WEATHER[G.weather];
  const wc=$id('weatherchip'); if(wc&&w){ wc.innerHTML=`<b>${w.ico}</b> ${w.name}　光 <b>${G.soil.light}</b>`; wc.onclick=showWeather; }
  const fg=$id('flowerg'); if(fg) fg.style.opacity = has('hana') ? 1 : .18;

  /* 図の上のミニ数値 */
  const mrow=(nm,v,key,inv,warn)=>`<div class="mrow ${warn?'warn':''}"><span>${nm}</span><b>${v}${delta(v,key,inv)}</b></div>`;
  let sh='<h4>土・空気（体の外）</h4>';
  sh+=mrow('土の水',G.soil.water,'soil.water',false,G.soil.water<=0);
  sh+=mrow('光（きょう）',G.soil.light,'soil.light');
  set('zone-soil',sh);
  let lh='<h4>葉の中</h4>';
  lh+=mrow('二酸化炭素',G.leaf.co2,'leaf.co2');
  lh+=mrow('デンプン',G.leaf.starch,'leaf.starch');
  lh+=mrow('出した酸素',G.leaf.o2,'leaf.o2');
  set('zone-leaf',lh);
  const nc=nightCost();
  let ph='<h4>師管（糖）</h4>';
  ph+=mrow('糖',G.phloem.sugar,'phloem.sugar',false,G.phloem.sugar+G.store<nc);
  if(G.store||has('choZou')) ph+=mrow('たくわえ',G.store,'store');
  ph+=`<div class="mrow" style="color:#98ab9a"><span>今夜の呼吸</span><b>-${nc}</b></div>`;
  set('zone-phloem',ph);

  /* 器官ノード */
  set('nodes',Object.keys(SP_POS).map(id=>{
    const c=DB[id],[x,y]=SP_POS[id];
    const owned=G.board.filter(o=>o.id===id).length;
    const unused=G.board.filter(o=>o.id===id&&!o.used).length;
    const cls=owned?(unused?'':'spent'):'ghost';
    return `<button class="onode ${cls}" id="node-${id}" style="left:${x}%;top:${y}%"
      onclick="${owned?`useOrganById('${id}',this)`:`showCard('${id}',true)`}">
      ${owned>1?`<span class="ocnt">${unused}/${owned}</span>`:''}
      <span class="oico">${c.ico}</span><span class="olab">${SP_LAB[id]||c.name.split('（')[0]}</span></button>`;
  }).join(''));

  /* 手札 */
  set('handrow',G.hand.map((id,i)=>{
    const c=DB[id];
    const wt = c.wx && c.wx[G.weather];
    const bad = wt && /元気-|効果なし/.test(wt);
    return `<button class="hcard ${bad?'bad':''}" onclick="playCard(${i},this)">
      <span class="ico">${c.ico}</span><div class="nm">${c.name}</div><div class="tx">${wt?`${w?w.ico:''} ${wt}`:c.text}</div></button>`;
  }).join('')||'<div style="color:#6d7f70;font-size:11px;padding:12px">手札なし。夜にしよう</div>');

  const gb=$id('grow');
  if(gb){ gb.classList.toggle('dim',G.energy<CFG.vpCost); gb.innerHTML=`🌱 成長 <span style="font-size:10px">(⚡${CFG.vpCost}→★1)</span>`; }

  if($id('sheet') && $id('sheet').classList && $id('sheet').classList.contains && $id('sheet').classList.contains('on')) renderSheet();

  PREV=JSON.parse(JSON.stringify({soil:G.soil,leaf:G.leaf,phloem:G.phloem,store:G.store,energy:G.energy,vp:G.vp,hp:G.hp,water:G.water}));
  guideApply();
  if(TUT) tutShow();
  if(!TUT) spSave();
}

/* ---------- 器官のヒント（PC：カーソルを合わせる／スマホ：長押し） ---------- */
let TIP_TIMER=null, TIP_HOLD=false;
function showTip(node){
  const tip=$id('otip'); if(!tip||!G||!node) return;
  const id=node.id.replace('node-',''), c=DB[id]; if(!c) return;
  const [i,o]=c.io?c.io(G):['',''];
  const owned=G.board.filter(x=>x.id===id).length;
  tip.innerHTML=`<b>${c.ico} ${c.name.split('（')[0]}</b><span class="in">使う：${i}</span><br><span class="out">得る：${o}</span>${owned?'':`<br><span class="cost">まだ持っていない（🛒 エネルギー${c.cost}）</span>`}`;
  const bw=$id('bodywrap'); const [x,y]=SP_POS[id];
  tip.style.left=''; tip.style.right=''; tip.style.top=''; tip.style.bottom='';
  if(x<50) tip.style.left=(x+8)+'%'; else tip.style.right=(100-x+8)+'%';
  if(y<50) tip.style.top=(y-4)+'%'; else tip.style.bottom=(100-y-4)+'%';
  tip.classList.add('on');
}
function hideTip(){ const tip=$id('otip'); if(tip) tip.classList.remove('on'); }
function bindTips(){
  const nodes=$id('nodes'); if(!nodes) return;
  const nodeOf=e=>{ const t=e.target.closest&&e.target.closest('.onode'); return t; };
  nodes.addEventListener('mouseover',e=>{ if(!matchMedia('(hover:hover)').matches) return; const n=nodeOf(e); if(n) showTip(n); });
  nodes.addEventListener('mouseout',e=>{ if(!matchMedia('(hover:hover)').matches) return; if(nodeOf(e)) hideTip(); });
  nodes.addEventListener('touchstart',e=>{ const n=nodeOf(e); if(!n) return; TIP_HOLD=false; clearTimeout(TIP_TIMER);
    TIP_TIMER=setTimeout(()=>{ TIP_HOLD=true; showTip(n); vib(15); },380); },{passive:true});
  const end=()=>{ clearTimeout(TIP_TIMER); if(TIP_HOLD){ setTimeout(hideTip,900); } };
  nodes.addEventListener('touchend',end,{passive:true});
  nodes.addEventListener('touchmove',()=>{ clearTimeout(TIP_TIMER); },{passive:true});
  nodes.addEventListener('touchcancel',end,{passive:true});
  /* 長押しのあとのタップは器官を使わない */
  nodes.addEventListener('click',e=>{ if(TIP_HOLD){ e.stopPropagation(); e.preventDefault(); TIP_HOLD=false; } },true);
  nodes.addEventListener('contextmenu',e=>e.preventDefault());
}

startApp();
