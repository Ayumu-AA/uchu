<script>/* 『超・新・星』 physics engine — 円だけの自前物理。ブラウザ／Node 両対応。
   依存なし。world を作り、step(world, dt) を呼ぶ。合体候補を返す。 */
(function (global) {
  'use strict';

  // ---- 天体データ（仕様 §2）。半径は等比 1.2。色は画像が入るまでの仮 ----
  const TIERS = [
    { key: 'moon',    name: '月',     km: 3475,    r: 20,  color: '#d2d2d8', dark: '#6f6f78' },
    { key: 'mercury', name: '水星',   km: 4879,    r: 24,  color: '#b39c86', dark: '#5a4a3e' },
    { key: 'mars',    name: '火星',   km: 6779,    r: 29,  color: '#d65a1f', dark: '#6b2a0b' },
    { key: 'venus',   name: '金星',   km: 12104,   r: 35,  color: '#f0e0a9', dark: '#9c864a' },
    { key: 'earth',   name: '地球',   km: 12742,   r: 41,  color: '#3d7fe6', dark: '#133573' },
    { key: 'neptune', name: '海王星', km: 49244,   r: 50,  color: '#2f56e8', dark: '#101f70' },
    { key: 'uranus',  name: '天王星', km: 50724,   r: 60,  color: '#a9e7e9', dark: '#4a9aa0' },
    { key: 'saturn',  name: '土星',   km: 116460,  r: 72,  color: '#e2ca92', dark: '#87713d' },
    { key: 'jupiter', name: '木星',   km: 139820,  r: 86,  color: '#d6a66c', dark: '#7a562a' },
    { key: 'sun',     name: '太陽',   km: 1392000, r: 103, color: '#ffb42a', dark: '#c45400' },
  ];
  // 超新星の跡に残る中性子星。段の外側にいる特別な天体（tier = 10）
  const NEUTRON = { key: 'neutron', name: '中性子星', km: 20, r: 20, color: '#dff1ff', dark: '#6aa8d8', massMul: 14 };

  const DEFAULTS = {
    gravity: 1500,     // px/s^2
    substeps: 4,
    iterations: 8,
    restitution: 0.12, // 反発。低いほどスイカゲームらしく落ち着く
    restVelocity: 70,  // これ未満の衝突速度では反発ゼロ（震え防止）
    friction: 0.35,    // 天体どうしの摩擦（クーロン）。回転に変わるので止まりにくくならない
    floorFriction: 0.6, // 床の摩擦。転がりを生む
    wallFriction: 0.3,
    angDamping: 0.9993, // 回転の減衰（転がり抵抗）。サブステップごと
    slop: 0.3,         // これ以下のめり込みは補正しない（震え防止）
    percent: 0.45,     // 1回の反復で解消するめり込みの割合
    damping: 0.9995,   // 速度の減衰（サブステップごと）
    sleepVelocity: 9,  // これ未満の速さが続いたら眠る
    sleepTime: 0.45,   // 眠るまでの時間（秒）
    wakeImpulse: 6,    // 眠っている天体を起こす速度変化
    maxVelocity: 2400,
    neutronPullRadius: 150, // 中性子星の重力が届く範囲（px）
    neutronPull: 900,       // 範囲の中心での引き寄せ加速度（px/s^2、月に対して）
  };

  function createWorld(W, H, opts) {
    return { W, H, bodies: [], nextId: 1, cfg: Object.assign({}, DEFAULTS, opts || {}), time: 0, impacts: [] };
  }

  function tierData(tier) { return tier === 10 ? NEUTRON : TIERS[tier]; }

  function addBody(world, tier, x, y, vx, vy) {
    const t = tierData(tier);
    const m = t.r * t.r * (t.massMul || 1);
    const I = 0.45 * m * t.r * t.r; // 慣性モーメント（球と円盤の間）
    const b = { id: world.nextId++, tier, x, y, vx: vx || 0, vy: vy || 0, r: t.r, m, invM: 1 / m, I, invI: 1 / I,
                angle: 0, omega: 0, age: 0, still: 0, asleep: false, remove: false };
    world.bodies.push(b);
    return b;
  }

  let currentImpacts = null; // step 中だけ有効。衝突の強さを記録（音用）
  function wakeAll(world) { for (const b of world.bodies) { b.asleep = false; b.still = 0; } }

  function wake(b) { if (b.asleep) { b.asleep = false; b.still = 0; } }

  // ---- 1フレーム進める。戻り値：同段の接触ペア（合体候補） ----
  function step(world, dt) {
    const cfg = world.cfg, bodies = world.bodies;
    const h = dt / cfg.substeps;
    const W = world.W, H = world.H;
    world.impacts.length = 0; currentImpacts = world.impacts;

    for (let s = 0; s < cfg.substeps; s++) {
      // 中性子星の重力：範囲内の起きている天体を引き寄せる。軽いほどよく引かれる
      const neutrons = bodies.filter(n => n.tier === 10);
      if (neutrons.length) {
        const R = cfg.neutronPullRadius;
        for (const b of bodies) {
          if (b.asleep || b.tier === 10) continue;
          for (const n of neutrons) {
            const dx = n.x - b.x, dy = n.y - b.y; const d = Math.hypot(dx, dy);
            if (d > R || d < 1) continue;
            const a = cfg.neutronPull * (1 - d / R) / Math.pow(b.m / 400, 0.5);
            b.vx += dx / d * a * h; b.vy += dy / d * a * h;
          }
        }
      }
      // 積分
      for (const b of bodies) {
        b.age += h;
        if (b.asleep) continue;
        b.vy += cfg.gravity * h;
        b.vx *= cfg.damping; b.vy *= cfg.damping;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > cfg.maxVelocity) { const k = cfg.maxVelocity / sp; b.vx *= k; b.vy *= k; }
        b.x += b.vx * h; b.y += b.vy * h;
        b.omega *= cfg.angDamping; b.angle += b.omega * h;
      }
      // 拘束の反復
      for (let it = 0; it < cfg.iterations; it++) {
        for (const b of bodies) resolveWalls(b, W, H, cfg);
        for (let i = 0; i < bodies.length; i++) {
          const a = bodies[i];
          for (let j = i + 1; j < bodies.length; j++) resolvePair(a, bodies[j], cfg);
        }
      }
    }

    // 眠り判定（フレーム単位）
    for (const b of bodies) {
      if (b.asleep) { b.vx = 0; b.vy = 0; b.omega = 0; continue; }
      const sp = Math.hypot(b.vx, b.vy) + Math.abs(b.omega) * b.r;
      if (sp < cfg.sleepVelocity) {
        b.still += dt;
        if (b.still >= cfg.sleepTime) { b.asleep = true; b.vx = 0; b.vy = 0; b.omega = 0; }
      } else b.still = 0;
    }
    world.time += dt;

    // 合体候補：同段どうしが触れている
    const merges = [];
    const used = new Set();
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      if (used.has(a.id) || a.age < 0.06 || a.tier === 10) continue; // 中性子星は合体しない
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        if (used.has(b.id) || b.tier !== a.tier || b.age < 0.06) continue;
        const d = Math.hypot(b.x - a.x, b.y - a.y);
        if (d <= a.r + b.r + 1.0) { merges.push([a, b]); used.add(a.id); used.add(b.id); break; }
      }
    }
    return merges;
  }

  function resolveWalls(b, W, H, cfg) {
    const e = cfg.restitution;
    if (b.x - b.r < 0) { b.x = b.r; if (b.vx < 0) { wallContact(b, -1, 0, -b.vx, cfg, cfg.wallFriction); b.vx = (-b.vx > cfg.restVelocity) ? -b.vx * e : 0; } wakeIf(b, cfg); }
    else if (b.x + b.r > W) { b.x = W - b.r; if (b.vx > 0) { wallContact(b, 1, 0, b.vx, cfg, cfg.wallFriction); b.vx = (b.vx > cfg.restVelocity) ? -b.vx * e : 0; } wakeIf(b, cfg); }
    if (b.y + b.r > H) {
      b.y = H - b.r;
      if (b.vy > 0) { if (b.vy > cfg.restVelocity && currentImpacts) currentImpacts.push({ x: b.x, y: b.y + b.r, v: b.vy, m: b.m });
        wallContact(b, 0, 1, b.vy, cfg, cfg.floorFriction); b.vy = (b.vy > cfg.restVelocity) ? -b.vy * e : 0; }
      else if (b.vy === 0) wallContact(b, 0, 1, cfg.gravity / 60, cfg, cfg.floorFriction); // 静止接触でも摩擦を働かせる
    }
  }
  // 静止した壁との接触摩擦。n は天体から壁へ向く単位法線、vn は法線方向の接近速度
  function wallContact(b, nx, ny, vn, cfg, mu) {
    const tx = -ny, ty = nx;
    // 接触点の速度 = v + ω×r（r = n*r）
    const cvx = b.vx - b.omega * ny * b.r, cvy = b.vy + b.omega * nx * b.r;
    const vt = -(cvx * tx + cvy * ty);        // 壁側から見た相対速度の接線成分
    const kt = b.invM + b.r * b.r * b.invI;
    let jt = -vt / kt;
    const jn = (1 + cfg.restitution) * Math.max(vn, 0) * b.m;
    const maxF = mu * Math.max(jn, cfg.gravity * b.m / 60 * 0.5);
    if (jt > maxF) jt = maxF; else if (jt < -maxF) jt = -maxF;
    b.vx -= jt * tx * b.invM; b.vy -= jt * ty * b.invM;
    b.omega -= jt * b.r * b.invI;
  }
  function wakeIf(b, cfg) { if (b.asleep && Math.hypot(b.vx, b.vy) > cfg.wakeImpulse) wake(b); }

  function resolvePair(a, b, cfg) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const rs = a.r + b.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rs * rs) return;
    let d = Math.sqrt(d2);
    let nx, ny;
    if (d < 1e-6) { d = 1e-6; nx = 0; ny = -1; } else { nx = dx / d; ny = dy / d; }
    const pen = rs - d;

    const wa = a.invM, wb = b.invM, wsum = wa + wb;

    // 位置補正（めり込み解消）
    const c = Math.max(pen - cfg.slop, 0) * cfg.percent / wsum;
    if (c > 0) {
      const ax = nx * c * wa, ay = ny * c * wa, bx = nx * c * wb, by = ny * c * wb;
      a.x -= ax; a.y -= ay; b.x += bx; b.y += by;
      // 大きく動かされたら起こす
      if (a.asleep && Math.hypot(ax, ay) > 0.6) wake(a);
      if (b.asleep && Math.hypot(bx, by) > 0.6) wake(b);
    }

    // 速度インパルス（法線）
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const e = (-vn > cfg.restVelocity) ? cfg.restitution : 0;
      if (e > 0 && currentImpacts) currentImpacts.push({ x: a.x + nx * a.r, y: a.y + ny * a.r, v: -vn, m: Math.min(a.m, b.m) });
      const jn = -(1 + e) * vn / wsum;
      a.vx -= jn * nx * wa; a.vy -= jn * ny * wa;
      b.vx += jn * nx * wb; b.vy += jn * ny * wb;
      // 摩擦（接線）— 接触点の速度に回転を含める。摩擦は回転に変わるので「転がる」
      const tx = -ny, ty = nx;
      const acx = a.vx - a.omega * ny * a.r, acy = a.vy + a.omega * nx * a.r;   // a の接触点速度（r = +n·ra）
      const bcx = b.vx + b.omega * ny * b.r, bcy = b.vy - b.omega * nx * b.r;   // b の接触点速度（r = −n·rb）
      const vt = (bcx - acx) * tx + (bcy - acy) * ty;
      const kt = wsum + a.r * a.r * a.invI + b.r * b.r * b.invI;
      let jt = -vt / kt;
      const maxF = cfg.friction * Math.abs(jn);
      if (jt > maxF) jt = maxF; else if (jt < -maxF) jt = -maxF;
      a.vx -= jt * tx * wa; a.vy -= jt * ty * wa;
      b.vx += jt * tx * wb; b.vy += jt * ty * wb;
      a.omega -= jt * a.r * a.invI;
      b.omega -= jt * b.r * b.invI;
      // 十分な衝撃なら眠っている側を起こす
      if (a.asleep && Math.abs(jn) * wa > cfg.wakeImpulse) wake(a);
      if (b.asleep && Math.abs(jn) * wb > cfg.wakeImpulse) wake(b);
    } else if (pen > 0) {
      // 触れているだけの接触にも弱い摩擦（重力ぶんの押し付け）を入れて、上の球が下の球の上を転がるようにする
      const tx = -ny, ty = nx;
      const acx = a.vx - a.omega * ny * a.r, acy = a.vy + a.omega * nx * a.r;
      const bcx = b.vx + b.omega * ny * b.r, bcy = b.vy - b.omega * nx * b.r;
      const vt = (bcx - acx) * tx + (bcy - acy) * ty;
      const kt = wsum + a.r * a.r * a.invI + b.r * b.r * b.invI;
      let jt = -vt / kt;
      const press = cfg.gravity / 60 * Math.min(a.m, b.m) * Math.abs(ny) / (cfg.iterations * cfg.substeps); // 1フレームぶんを反復で分割
      const maxF = cfg.friction * press;
      if (jt > maxF) jt = maxF; else if (jt < -maxF) jt = -maxF;
      a.vx -= jt * tx * wa; a.vy -= jt * ty * wa;
      b.vx += jt * tx * wb; b.vy += jt * ty * wb;
      a.omega -= jt * a.r * a.invI;
      b.omega -= jt * b.r * b.invI;
    }
  }

  // 超新星：中心から半径 R 内の天体を外向きに吹き飛ばす
  function blast(world, cx, cy, R, power) {
    for (const b of world.bodies) {
      const dx = b.x - cx, dy = b.y - cy;
      const d = Math.hypot(dx, dy) || 1;
      if (d > R) continue;
      const k = (1 - d / R);
      const s = power * (0.5 + 0.5 * k) / Math.pow(b.m / 400, 0.35); // 軽いほど飛ぶ。遠くても半分は届く
      b.vx += dx / d * s * 1.2; b.vy += dy / d * s * 0.2 - s * 0.8; // 横へ強く、上へ放り上げる（下向きには押し込まない）
      b.omega += (Math.random() - 0.5) * 12;
      wake(b);
    }
  }

  function kineticEnergy(world) {
    let e = 0; for (const b of world.bodies) e += 0.5 * b.m * (b.vx * b.vx + b.vy * b.vy); return e;
  }
  function maxPenetration(world) {
    let p = 0; const bs = world.bodies;
    for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
      const a = bs[i], b = bs[j];
      const pen = a.r + b.r - Math.hypot(a.x - b.x, a.y - b.y);
      if (pen > p) p = pen;
    }
    for (const b of bs) { p = Math.max(p, -(b.x - b.r), b.x + b.r - world.W, b.y + b.r - world.H); }
    return p;
  }

  const Engine = { TIERS, NEUTRON, DEFAULTS, createWorld, addBody, step, blast, wakeAll, wake, tierData, kineticEnergy, maxPenetration };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  global.SuikaEngine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

      s.score += SCORE[nb.tier];
      s.effects.push({ kind: 'ring', x: mx, y: my, r: t.r, t: 0, color: t.color });
      const stacked = s.effects.filter(f => f.kind === 'text' && f.t < 0.4).length;
      s.effects.push({ kind: 'text', x: mx, y: my - t.r - 6 - stacked * 18, t: 0, text: `${t.name}  ${t.km.toLocaleString()} km` });
      E.wakeAll(w);
      onTierMade(nb.tier);
    }
    if (merges.length) { w.bodies = w.bodies.filter(b => !b.remove); updateHud(); checkEarn(); s.saveTimer = 0.4; }

    // 次の天体を出すタイミング
    if (!s.canDrop && !s.held) {
      s.dropTimer += dt;
      const d = s.lastDrop;
      const settled = !d || (d.remove || d.y > LINE_Y + d.r + 10 || Math.hypot(d.vx, d.vy) < 40);
      if ((s.dropTimer > 0.32 && settled) || s.dropTimer > 0.9) {
        s.held = { tier: s.queue.shift() }; s.queue.push(randTier()); s.canDrop = true; updateHud(); writeSave();
      }
    }
    // 合体の後、落ち着いたところで保存
    if (s.saveTimer > 0) { s.saveTimer -= dt; if (s.saveTimer <= 0) writeSave(); }

    // ゲームオーバー判定
    let danger = false;
    for (const b of w.bodies) {
      if (b === s.lastDrop && b.age < 0.5) continue;
      if (b.y - b.r < LINE_Y && Math.hypot(b.vx, b.vy) < 30) { danger = true; break; }
    }
    s.overTimer = danger ? s.overTimer + dt : 0;
    if (s.overTimer > 1.4) gameOver();

    // 演出
    for (const pt of s.particles) { pt.t += dt; pt.vy += (pt.g === undefined ? 900 : pt.g) * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.985; pt.vy *= 0.985; }
    s.particles = s.particles.filter(pt => pt.t < pt.life);
    for (const fx of s.effects) fx.t += dt;
    s.effects = s.effects.filter(fx => fx.t < (fx.kind === 'text' || fx.kind === 'note' ? 1.1 : fx.kind === 'ripple' ? 0.8 : (fx.big ? 0.7 : 0.5)));
    s.shake = Math.max(0, s.shake - dt * 2.2);
    s.flash = Math.max(0, s.flash - dt * 3.6);
    if (s.toastTimer > 0) { s.toastTimer -= dt; if (s.toastTimer <= 0) s.toast.classList.remove('show'); }
    if (s.armedNeutron) { s.neutronArmT -= dt; if (s.neutronArmT <= 0 || !w.bodies.includes(s.armedNeutron)) { s.armedNeutron = null; s.mode.hidden = true; } }
    if (s.cardTimer > 0) { s.cardTimer -= dt; if (s.cardTimer <= 0) { s.card.classList.remove('show'); for (const x of s.order.children) x.classList.remove('on'); } }
  }

  // ---------------- アイテム入手 ----------------
  function onTierMade(tier) {
    if (tier === 6) earn('scope'); else if (tier === 7) earn('wave'); else if (tier === 8) earn('meteor');
  }
  function checkEarn() {
    const s = state;
    if (s.score >= 150) earn('swap');
    if (s.chain >= 3) earn('wind');
  }
  function earn(key) {
    const s = state; if (s.earned.has(key)) return;
    s.earned.add(key);
    const it = ITEMS.find(i => i.key === key);
    if (s.items[key] >= ITEM_CAP) { showToast(`${it.name}はもう${ITEM_CAP}個持っている`, it.how); return; }
    s.items[key]++; saveItems(s.items); paintItems(); SFX.get();
    showToast(`${it.icon} ${it.name}を手に入れた`, it.how, 1.8);
    const e = s.itemEls[key]; if (e) { e.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 500 }); }
  }
  // 下の並びをタップ → その天体の名前カード（名前・直径・大きさ順・分類）
  const KIND = { moon: '衛星', sun: '恒星' };
  function showCard(t, d) {
    const s = state; const idx = E.TIERS.indexOf(t); const a = ASSETS[t.key];
    for (const x of s.order.children) x.classList.toggle('on', x === d);
    s.card.innerHTML = `<i></i><div><b></b><span></span></div>`;
    s.card.querySelector('i').style.cssText = a ? `background:url(${a.b64}) center/${(100 / a.frac).toFixed(0)}% no-repeat` : `background:${t.color}`;
    s.card.querySelector('b').textContent = t.name;
    s.card.querySelector('span').innerHTML = `直径 ${t.km.toLocaleString()} km<br>大きさ ${idx + 1} 番目 ／ 10　·　${KIND[t.key] || '惑星'}`;
    s.card.classList.add('show'); s.cardTimer = 2.2;
  }
  function showHelp() {
    const s = state; if (s.over || s.helpOpen) return;
    s.helpOpen = true; s.paused = true; disarm();
    const box = el('div', 'sn-helpbox');
    box.innerHTML = `<h3>アイテム</h3>
      <div class="use">プレイ中の達成でだけ手に入る（1ゲームに各1回）。次のゲームにも持ち越せて、各3個まで。<br>
      <b>使い方</b>　⇄ 🔭 🌬 〰 は <b>2回タップ</b>で発動。☄ ● は <b>タップしてから天体をタップ</b>。ほかをタップで取り消し。<br>
      アイテムを使った回のスコアは「アイテムあり」のベストに入る。<br>
      右上の <b>❚❚</b> で一時停止（キーボードは P か Esc）。途中で閉じても、次に開いたとき続きから遊べる。</div>
      <div class="row"><div class="ic">✦</div><div><b>中性子星（アイテムではない）</b><span>太陽どうしが合体して超新星になると残る。近くの星を引き寄せる。<b>2回タップすると弾けて</b>、まわりの星を消し、遠くの星を吹き飛ばす。自分も消える</span></div></div>`;
    for (const it of ITEMS) {
      const r = el('div', 'row'); r.innerHTML = `<div class="ic"></div><div><b></b><span></span><em></em></div>`;
      r.querySelector('.ic').textContent = it.icon; r.querySelector('b').textContent = it.name.replace('\u200b', '');
      r.querySelector('span').textContent = it.desc; r.querySelector('em').textContent = '入手：' + it.how + (it.kind === 'target' ? '　·　使い方：天体をタップ' : '　·　使い方：2回タップ');
      box.appendChild(r);
    }
    const btn = el('button', 'sn-btn close'); btn.textContent = 'とじる'; btn.onclick = () => { box.remove(); s.helpOpen = false; s.paused = false; };
    box.appendChild(btn); s.stage.appendChild(box); btn.focus({ preventScroll: true }); box.scrollTop = 0;
  }
  function showToast(title, sub, sec) {
    const s = state; s.toast.innerHTML = `<b></b><span></span>`; s.toast.querySelector('b').textContent = title; s.toast.querySelector('span').textContent = sub || '';
    s.toast.classList.add('show'); s.toastTimer = sec || 1.4;
  }

  // ---------------- アイテム使用 ----------------
  function buildItemBar() {
    const s = state; s.itemsBar.innerHTML = '';
    for (const it of ITEMS) {
      const b = el('button', 'sn-item'); b.type = 'button';
      b.innerHTML = `<span class="ic"></span><span class="nm"></span><span class="ct"></span>`;
      b.querySelector('.ic').textContent = it.icon; b.querySelector('.nm').textContent = it.name;
      b.addEventListener('pointerdown', ev => ev.stopPropagation());
      b.addEventListener('click', () => onItemTap(it));
      s.itemsBar.appendChild(b); s.itemEls[it.key] = b;
    }
    paintItems();
  }
  function paintItems() {
    const s = state;
    for (const it of ITEMS) { const b = s.itemEls[it.key]; const n = s.items[it.key] | 0; b.classList.toggle('zero', n === 0); b.classList.toggle('armed', s.armed === it.key); b.querySelector('.ct').textContent = n; }
  }
  function onItemTap(it) {
    const s = state; if (s.over || s.paused) return;
    SFX.init();
    const n = s.items[it.key] | 0;
    if (n === 0) { showToast(`${it.icon} ${it.name}：${it.desc}`, `入手：${it.how}`, 2.2); disarm(); return; }
    if (s.armed === it.key) { // 2回目のタップ
      if (it.kind === 'now') useItem(it.key); else disarm();
      return;
    }
    s.armed = it.key; SFX.arm(); paintItems();
    s.dim.hidden = false; s.mode.hidden = false;
    s.mode.textContent = it.kind === 'target' ? `${it.name}：天体をタップ（ほかをタップで取り消し）` : `${it.name}：もう一度タップで使う`;
  }
  function disarm() { const s = state; if (!s.armed) return; s.armed = null; s.dim.hidden = true; s.mode.hidden = true; paintItems(); }
  function useItem(key, target) {
    const s = state, w = s.world; const it = ITEMS.find(i => i.key === key);
    if ((s.items[key] | 0) <= 0) { disarm(); return; }
    if (key === 'meteor' && (!target || target.tier >= 9)) { showToast('隕石は太陽と中性子星には使えない', ''); return; }
    if (key === 'bh' && !target) return;
    // 効果
    if (key === 'swap') {
      if (s.held) { const t = s.held.tier; s.held.tier = s.queue[0]; s.queue[0] = t; } else { const t = s.queue[0]; s.queue[0] = s.queue[1]; s.queue[1] = t; }
    } else if (key === 'scope') {
      s.telescope = true;
    } else if (key === 'wind') {
      for (const b of w.bodies) if (b.tier <= 1) { b.remove = true; for (let i = 0; i < 6; i++) s.particles.push({ x: b.x, y: b.y, vx: 300 + Math.random() * 500, vy: -60 + Math.random() * 120, t: 0, life: 0.5 + Math.random() * 0.4, r: 1.5 + Math.random() * 2, hue: 200, g: 0 }); }
      w.bodies = w.bodies.filter(b => !b.remove);
      for (let i = 0; i < 40; i++) s.particles.push({ x: -10, y: Math.random() * H, vx: 700 + Math.random() * 500, vy: 0, t: -Math.random() * 0.3, life: 0.6, r: 1 + Math.random() * 1.5, hue: 45, g: 0 });
      E.wakeAll(w);
    } else if (key === 'wave') {
      E.wakeAll(w);
      for (const b of w.bodies) { const k = 1 / Math.pow(b.m / 400, 0.25); b.vx += (Math.random() - 0.5) * 1000 * k; b.vy -= (380 + Math.random() * 520) * k; b.omega += (Math.random() - 0.5) * 16 * k; }
      s.shake = 1.0; s.slowmo = 0.2;
      for (let i = 0; i < 3; i++) s.effects.push({ kind: 'ripple', t: -i * 0.12 });
    } else if (key === 'meteor') {
      const t = target; const nb = E.addBody(w, t.tier + 1, t.x, t.y, t.vx, t.vy); nb.angle = t.angle; nb.omega = t.omega; nb.age = 0.2;
      w.bodies = w.bodies.filter(b => b !== t); s.seen.add(nb.tier);
      const td = E.tierData(nb.tier);
      s.effects.push({ kind: 'ring', x: t.x, y: t.y, r: td.r, t: 0, color: '#ffd27a' });
      s.effects.push({ kind: 'text', x: t.x, y: t.y - td.r - 6, t: 0, text: `${td.name}  ${td.km.toLocaleString()} km` });
      for (let i = 0; i < 24; i++) { const a = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 300; s.particles.push({ x: t.x, y: t.y - td.r * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, t: 0, life: 0.5, r: 1.5, hue: 30 }); }
      E.wakeAll(w); onTierMade(nb.tier);
    } else if (key === 'bh') {
      const t = target; const victims = bhTargets(t);
      w.bodies = w.bodies.filter(b => !victims.includes(b));
      s.effects.push({ kind: 'ring', x: t.x, y: t.y, r: t.r * 1.4, t: 0, color: '#8d96b3' });
      for (const v of victims) for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, d = v.r * (0.5 + Math.random()); const px = v.x + Math.cos(a) * d, py = v.y + Math.sin(a) * d;
        s.particles.push({ x: px, y: py, vx: (t.x - px) * 4, vy: (t.y - py) * 4, t: 0, life: 0.4, r: 1.6, hue: 260, g: 0 }); }
      s.shake = 0.35;
      E.wakeAll(w);
    }
    s.items[key]--; saveItems(s.items); s.itemsUsed++;
    SFX.use(key); disarm(); updateHud(); writeSave();
    showToast(`${it.icon} ${it.name}`, it.desc, 1.1);
  }

  // ---------------- 中性子星の起爆（仕様：タップで周囲を吹き飛ばして消す。自分も消える） ----------------
  const NEUTRON_KILL_R = 150, NEUTRON_PUSH_R = 330;
  function detonate(n) {
    const s = state, w = s.world;
    s.armedNeutron = null; s.mode.hidden = true;
    const victims = w.bodies.filter(b => b !== n && Math.hypot(b.x - n.x, b.y - n.y) <= NEUTRON_KILL_R);
    for (const v of victims) {
      for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 380; s.particles.push({ x: v.x, y: v.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, t: 0, life: 0.5 + Math.random() * 0.4, r: 1.5 + Math.random() * 2, hue: 205, g: 300 }); }
    }
    w.bodies = w.bodies.filter(b => b !== n && !victims.includes(b));
    E.blast(w, n.x, n.y, NEUTRON_PUSH_R, 1300);
    E.wakeAll(w);
    s.shake = 0.8; s.flash = 0.5; s.slowmo = 0.25;
    s.effects.push({ kind: 'ring', x: n.x, y: n.y, r: 30, t: 0, color: '#dff1ff', big: true });
    s.effects.push({ kind: 'ring', x: n.x, y: n.y, r: NEUTRON_KILL_R * 0.35, t: -0.08, color: '#8fc5ff', big: true });
    s.effects.push({ kind: 'text', x: n.x, y: n.y - 30, t: 0, text: `中性子星が弾けた　${victims.length}個消滅`, big: false });
    SFX.noiseBurst(3000, 150, 1.0, 0.5, 1); SFX.tone(220, 40, 0.9, 'sine', 0.5);
    updateHud(); writeSave();
  }

  // ---------------- 超新星 ----------------
  function supernova(x, y) {
    const s = state;
    E.blast(s.world, x, y, 380, 1800);
    const n = E.addBody(s.world, 10, x, y); n.age = 0.1;
    s.seen.add(10);
    s.score += SUPERNOVA_SCORE;
    s.shake = 1; s.flash = 1; s.slowmo = 0.45;
    SFX.supernova();
    for (let i = 0; i < 110; i++) {
      const a = Math.random() * Math.PI * 2, sp = 180 + Math.random() * 720;
      s.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, t: 0, life: 0.6 + Math.random() * 0.9,
        r: 1.2 + Math.random() * 2.6, hue: Math.random() < 0.35 ? 48 : 22 + Math.random() * 14 });
    }
    s.effects.push({ kind: 'ring', x, y, r: 40, t: 0, color: '#fff6d8', big: true });
    s.effects.push({ kind: 'ring', x, y, r: 20, t: -0.12, color: '#ffb42a', big: true });
    s.effects.push({ kind: 'text', x, y: y - 40, t: 0, text: '超新星爆発！', big: true });
    s.effects.push({ kind: 'text', x, y: y - 16, t: 0, text: `+${SUPERNOVA_SCORE}` });
    s.effects.push({ kind: 'note', t: 0 });
    setTimeout(() => { if (state === s) earn('bh'); }, 900);
  }

  // ---------------- 結果 ----------------
  function gameOver() {
    const s = state; s.over = true; s.hint.style.opacity = '0'; disarm(); clearSave();
    const usedItems = s.itemsUsed > 0;
    let newBest = false;
    if (usedItems) { if (s.score > s.bestItems) { s.bestItems = s.score; store.set(K.bestItems, String(s.score)); newBest = true; } }
    else { if (s.score > s.best) { s.best = s.score; store.set(K.best, String(s.score)); newBest = true; } }
    let maxTier = -1; for (const t of s.seen) maxTier = Math.max(maxTier, t === 10 ? 9 : t);
    const isRecord = maxTier > s.maxTierBefore;
    if (isRecord) store.set(K.maxTier, String(maxTier));
    const bestTier = Math.max(maxTier, s.maxTierBefore);
    const box = el('div', 'sn-over');
    const reached = maxTier >= 0 ? E.tierData(maxTier).name : '—';
    box.innerHTML = `<h2>ここまで</h2>
      <p>スコア <b>${s.score}</b>${newBest ? ' <span class="sn-rec">ベスト更新</span>' : ''}<br><span style="font-size:12px">${usedItems ? `アイテム使用 ${s.itemsUsed} 回` : 'アイテム未使用'}</span></p>
      <div class="bests"><div>ベスト（アイテムなし）<b>${s.best}</b></div><div>ベスト（アイテムあり）<b>${s.bestItems}</b></div></div>
      <div class="sn-lineup"></div>
      <p>今回いちばん大きく育った星：<b>${reached}</b>${isRecord ? ' <span class="sn-rec">新記録</span>' : ''}<br>
      <span style="font-size:12px">これまでの最高：${bestTier >= 0 ? E.tierData(bestTier).name : '—'}</span></p>`;
    const lineup = box.querySelector('.sn-lineup');
    E.TIERS.forEach((t, i) => {
      const d = el('div'); if (!s.seen.has(i)) d.className = 'dim';
      const im = document.createElement('i'); const sz = 10 + t.r * 0.2; const a = ASSETS[t.key];
      im.style.cssText = a ? `width:${sz}px;height:${sz}px;background:url(${a.b64}) center/${(100 / a.frac).toFixed(0)}% no-repeat` : `width:${sz}px;height:${sz}px;background:${t.color}`;
      if (!s.seen.has(i)) im.className = 'dim';
      const b = document.createElement('b'); b.textContent = t.name;
      d.append(im, b); lineup.appendChild(d);
    });
    const btn = el('button', 'sn-btn'); btn.textContent = 'もう一回'; btn.onclick = () => restart(true);
    box.appendChild(btn);
    if (s.homeUrl) { const hb = el('button', 'sn-btn ghost'); hb.textContent = 'ゲーム一覧へ'; hb.onclick = () => { location.href = s.homeUrl; }; box.appendChild(hb); } s.stage.appendChild(box); btn.focus();
  }

  function updateHud() {
    const s = state; s.scoreEl.textContent = s.score;
    const usedItems = s.itemsUsed > 0;
    const best = usedItems ? Math.max(s.bestItems, s.score) : Math.max(s.best, s.score);
    s.bestEl.innerHTML = `Best ${best}<small>${usedItems ? 'アイテムあり' : 'アイテムなし'}</small>`;
    s.nextEl.innerHTML = '';
    const n = s.telescope ? 3 : 1;
    for (let i = 0; i < n; i++) {
      const t = E.tierData(s.queue[i]); const a = ASSETS[t.key];
      const d = el('span', 'sn-nextdot' + (i > 0 ? ' sm' : ''));
      d.style.background = a ? `url(${a.b64}) center/${(100 / a.frac).toFixed(0)}% no-repeat` : t.color; if (a) d.style.boxShadow = 'none';
      s.nextEl.appendChild(d);
    }
  }

  // ---------------- 描画 ----------------
  function render(dt) {
    const s = state, c = s.ctx, k = s.scale * s.dpr;
    c.setTransform(k, 0, 0, k, 0, 0);
    const sx = s.shake > 0 ? (Math.random() - 0.5) * 14 * s.shake : 0, sy = s.shake > 0 ? (Math.random() - 0.5) * 14 * s.shake : 0;
    c.clearRect(-20, -20, W + 40, H + 40);
    c.save(); c.translate(sx, sy);
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0d1226'); g.addColorStop(1, '#070a14');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    drawStars(c);
    c.strokeStyle = 'rgba(140,150,190,.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(1, 0); c.lineTo(1, H - 1); c.lineTo(W - 1, H - 1); c.lineTo(W - 1, 0); c.stroke();
    c.setLineDash([6, 8]); c.strokeStyle = s.overTimer > 0 ? 'rgba(255,122,69,.9)' : 'rgba(255,122,69,.4)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(0, LINE_Y); c.lineTo(W, LINE_Y); c.stroke(); c.setLineDash([]);

    // 重力波の波紋
    for (const fx of s.effects) if (fx.kind === 'ripple' && fx.t >= 0) { const p = fx.t / 0.8; c.globalAlpha = 0.35 * (1 - p); c.strokeStyle = '#bfe0ff'; c.lineWidth = 2; c.beginPath(); c.arc(W / 2, H * 0.7, 40 + p * 520, 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1; }

    for (const b of s.world.bodies) drawBody(c, b.tier, b.x, b.y, b.r, b.angle);
    // 構えた中性子星：消える範囲を示す
    if (s.armedNeutron) { const n = s.armedNeutron; const pl = 0.5 + 0.5 * Math.sin(performance.now() / 120);
      c.fillStyle = `rgba(143,197,255,${0.08 + 0.06 * pl})`; c.beginPath(); c.arc(n.x, n.y, NEUTRON_KILL_R, 0, Math.PI * 2); c.fill();
      c.strokeStyle = `rgba(223,241,255,${0.5 + 0.4 * pl})`; c.lineWidth = 2; c.setLineDash([8, 6]); c.beginPath(); c.arc(n.x, n.y, NEUTRON_KILL_R, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
    // アイテム対象のハイライト
    if (s.armed && ITEMS.find(i => i.key === s.armed).kind === 'target') {
      const b = bodyAt(s.pointer.x, s.pointer.y);
      if (b) { const list = s.armed === 'bh' ? bhTargets(b) : [b];
        c.strokeStyle = '#ffb42a'; c.lineWidth = 3; c.setLineDash([6, 5]);
        for (const v of list) { c.beginPath(); c.arc(v.x, v.y, v.r + 6, 0, Math.PI * 2); c.stroke(); }
        c.setLineDash([]); }
    }
    if (s.held && !s.over && !s.paused) {
      const t = E.tierData(s.held.tier); const x = clamp(s.pointerX, t.r, W - t.r);
      c.strokeStyle = 'rgba(233,237,247,.14)'; c.lineWidth = 1; c.setLineDash([3, 6]);
      c.beginPath(); c.moveTo(x, SPAWN_Y + t.r); c.lineTo(x, H); c.stroke(); c.setLineDash([]);
      drawBody(c, s.held.tier, x, SPAWN_Y, t.r, 0);
    }
    for (const pt of s.particles) {
      if (pt.t < 0) continue;
      const p = pt.t / pt.life; c.globalAlpha = 1 - p * p;
      c.fillStyle = p < 0.25 && pt.hue < 100 ? '#fff8e6' : `hsl(${pt.hue} 100% ${62 - p * 30}%)`;
      c.beginPath(); c.arc(pt.x, pt.y, pt.r * (1 - p * 0.6), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    for (const fx of s.effects) {
      if (fx.t < 0) continue;
      if (fx.kind === 'ring') {
        const p = fx.t / (fx.big ? 0.7 : 0.5); if (p > 1) continue; c.globalAlpha = 1 - p; c.strokeStyle = fx.color; c.lineWidth = fx.big ? 5 * (1 - p) + 2 : 3;
        c.beginPath(); c.arc(fx.x, fx.y, fx.r * (1 + p * (fx.big ? 7 : 1.2)), 0, Math.PI * 2); c.stroke(); c.globalAlpha = 1;
      } else if (fx.kind === 'text') {
        const p = fx.t / 1.1; c.globalAlpha = 1 - p * p; c.fillStyle = fx.big ? '#fff8e0' : '#fff3cf';
        c.font = (fx.big ? '800 24px' : '600 13px') + ' system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif'; c.textAlign = 'center';
        if (fx.big) { c.shadowColor = 'rgba(255,170,40,.9)'; c.shadowBlur = 18; }
        c.fillText(fx.text, clamp(fx.x, 70, W - 70), fx.y - p * 26); c.shadowBlur = 0; c.globalAlpha = 1;
      } else if (fx.kind === 'note') {
        const p = fx.t / 1.1; c.globalAlpha = Math.min(1, 1.6 - p * 1.2); c.fillStyle = '#8d96b3';
        c.font = '11px system-ui, sans-serif'; c.textAlign = 'center';
        c.fillText('※ほんとうは太陽2つでは超新星にならない（8つぶん以上が必要）', W / 2, LINE_Y + 34); c.globalAlpha = 1;
      }
    }
    c.restore();
    if (s.flash > 0) { c.fillStyle = `rgba(255,244,220,${s.flash * 0.65})`; c.fillRect(0, 0, W, H); }
  }

  let starField = null;
  function drawStars(c) {
    if (!starField) { starField = []; let q = 7; for (let i = 0; i < 70; i++) { q = (q * 9301 + 49297) % 233280; const x = q / 233280 * W; q = (q * 9301 + 49297) % 233280; const y = q / 233280 * H; starField.push([x, y, 0.4 + (i % 3) * 0.35]); } }
    c.fillStyle = 'rgba(200,210,240,.35)';
    for (const [x, y, r] of starField) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
  }

  function drawBody(c, tier, x, y, r, angle) {
    const t = E.tierData(tier);
    const img = IMGS[t.key], a = ASSETS[t.key];
    if (img && a) {
      if (tier === 9) { const gl = c.createRadialGradient(x, y, r * 0.85, x, y, r * 1.45); gl.addColorStop(0, 'rgba(255,170,40,.6)'); gl.addColorStop(1, 'rgba(255,150,30,0)'); c.fillStyle = gl; c.beginPath(); c.arc(x, y, r * 1.45, 0, Math.PI * 2); c.fill(); }
      const size = 2 * r / a.frac;
      c.save(); c.translate(x, y); if (!NO_ROTATE[t.key]) c.rotate(angle || 0);
      c.drawImage(img, -size / 2, -size / 2, size, size); c.restore();
      return;
    }
    if (tier === 9) { const gl = c.createRadialGradient(x, y, r * 0.8, x, y, r * 1.35); gl.addColorStop(0, 'rgba(255,180,42,.55)'); gl.addColorStop(1, 'rgba(255,180,42,0)'); c.fillStyle = gl; c.beginPath(); c.arc(x, y, r * 1.35, 0, Math.PI * 2); c.fill(); }
    if (tier === 10) { const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 160); const R = r * (1.9 + 0.5 * pulse);
      const gl = c.createRadialGradient(x, y, r * 0.5, x, y, R); gl.addColorStop(0, `rgba(170,215,255,${0.55 * pulse + 0.2})`); gl.addColorStop(1, 'rgba(160,210,255,0)'); c.fillStyle = gl; c.beginPath(); c.arc(x, y, R, 0, Math.PI * 2); c.fill();
      const R2 = state.world.cfg.neutronPullRadius; c.save(); c.globalAlpha = 0.10 + 0.06 * pulse; c.strokeStyle = '#bfe0ff'; c.lineWidth = 1; c.setLineDash([2, 7]);
      c.beginPath(); c.arc(x, y, R2 * (0.98 + 0.02 * pulse), 0, Math.PI * 2); c.stroke(); c.restore();
      const ang = performance.now() / 380; c.save(); c.translate(x, y); c.rotate(ang); c.globalAlpha = 0.35 + 0.25 * pulse; c.strokeStyle = '#dff1ff'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(0, -r * 0.6); c.lineTo(0, -r * 3.2); c.moveTo(0, r * 0.6); c.lineTo(0, r * 3.2); c.stroke(); c.restore(); c.globalAlpha = 1; }
    if (tier === 7) ringBack(c, x, y, r, t);
    const g = c.createRadialGradient(x - r * 0.38, y - r * 0.38, r * 0.1, x, y, r);
    g.addColorStop(0, lighten(t.color, 0.35)); g.addColorStop(0.55, t.color); g.addColorStop(1, t.dark);
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
    if (tier === 8) { c.fillStyle = 'rgba(190,70,40,.85)'; c.beginPath(); c.ellipse(x + r * 0.35, y + r * 0.3, r * 0.22, r * 0.13, 0, 0, Math.PI * 2); c.fill(); }
    if (tier === 7) ringFront(c, x, y, r, t);
  }
  function ringBack(c, x, y, r, t) { c.save(); c.strokeStyle = t.color; c.lineWidth = r * 0.28; c.globalAlpha = 0.9; c.beginPath(); c.ellipse(x, y, r * 1.75, r * 0.5, -0.25, Math.PI, Math.PI * 2); c.stroke(); c.restore(); }
  function ringFront(c, x, y, r, t) { c.save(); c.strokeStyle = t.color; c.lineWidth = r * 0.28; c.beginPath(); c.ellipse(x, y, r * 1.75, r * 0.5, -0.25, 0, Math.PI); c.stroke(); c.restore(); }
  function lighten(hex, k) { const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; const f = v => Math.round(v + (255 - v) * k); return `rgb(${f(r)},${f(g)},${f(b)})`; }

  const api = { mount, unmount, get state() { return state; }, _gameOver: () => { if (state && !state.over) gameOver(); }, _save: () => writeSave(), ITEMS };
  global.SuikaGame = api;
})(window);
</script>
<script>SuikaGame.mount(document.getElementById('app'), { homeUrl: './index.html' });</script>
</body>
