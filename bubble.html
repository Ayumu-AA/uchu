<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<title>ふくらませて、はなす</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0b0f1e;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%}
.bb-root{position:relative;width:100%;height:100%;min-height:100vh;background:var(--bb-bg);color:var(--bb-text);font-family:var(--bb-font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.bb-root *{box-sizing:border-box}
.bb-bar{position:absolute;left:0;top:0;right:0;height:56px;display:flex;align-items:center;padding:0 12px;gap:10px;font-size:15px;z-index:2;pointer-events:none}
.bb-bar .bb-left{flex:1;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.bb-bar .bb-score{font-size:22px;font-weight:700;color:var(--bb-accent);font-variant-numeric:tabular-nums}
.bb-bar .bb-mult{font-size:13px;opacity:.85;margin-left:6px}
.bb-bar .bb-right{display:flex;gap:6px;pointer-events:auto}
.bb-btn{background:transparent;border:1px solid var(--bb-line);color:var(--bb-text);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font-size:16px;font-family:inherit;cursor:pointer}
.bb-btn:active{background:rgba(255,255,255,.08)}
.bb-canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.bb-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,15,30,.78);z-index:3;padding:24px}
.bb-panel{width:100%;max-width:340px;text-align:center;background:rgba(11,15,30,.92);border:1px solid var(--bb-line);border-radius:18px;padding:26px 22px}
.bb-panel h1{font-size:26px;margin:0 0 8px;color:var(--bb-accent)}
.bb-panel h2{font-size:20px;margin:0 0 14px}
.bb-panel p{margin:6px 0;font-size:15px;line-height:1.6}
.bb-panel .bb-big{font-size:40px;font-weight:700;color:var(--bb-accent);font-variant-numeric:tabular-nums;margin:4px 0}
.bb-panel .bb-sub{opacity:.8;font-size:14px}
.bb-panel .bb-new{color:var(--bb-accent);font-weight:700;font-size:17px;animation:bbpop .5s ease-out}
.bb-panel .bb-trivia{font-size:12px;opacity:.7;margin-top:14px;line-height:1.6;text-align:left}
.bb-panel .bb-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.bb-cta{background:var(--bb-accent);color:#1a1200;border:none;border-radius:12px;height:48px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer}
.bb-cta:active{filter:brightness(.92)}
.bb-ghost{background:transparent;border:1px solid var(--bb-line);color:var(--bb-text);border-radius:12px;height:44px;font-size:15px;font-family:inherit;cursor:pointer}
.bb-warn{font-size:13px;color:var(--bb-accent)}
.bb-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:2}
.bb-hint{position:absolute;left:0;right:0;bottom:19%;text-align:center;font-size:16px;opacity:.75;pointer-events:none;z-index:1;animation:bbpulse 1.6s ease-in-out infinite}
@keyframes bbpulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes bbpop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.bb-bar .bb-dots{font-size:13px;letter-spacing:1px;line-height:1.1}
.bb-bar .bb-scene{font-size:12px;opacity:.85;margin-top:2px}
.bb-scorewrap{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.bb-need{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.bb-need.bb-ok{color:var(--bb-accent);opacity:1;font-weight:700}
.bb-bar{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.bb-banner{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:2;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.bb-banner-main{font-size:40px;font-weight:700;color:#fff}
.bb-banner-sub{font-size:16px;color:var(--bb-accent);font-weight:700;margin-top:4px}
.bb-banner-in{animation:bbbanner 1.6s ease-out forwards}
@keyframes bbbanner{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.bb-hint{text-shadow:0 1px 4px rgba(0,0,0,.7)}
.bb-btn.bb-off{opacity:.4;text-decoration:line-through}

</style>
</head>
<body>
<div id="app"></div>

// engine.js — 玉の状態機械・風・合体・場面・得点。DOM を触らない純粋ロジック。
// 使い方: const e = new Engine(DATA, W, H, rng); e.press(); e.step(dt); e.release(); e.takeEvents()
function Engine(D, W, H, rng) {
  this.D = D; this.W = W; this.H = H;
  this.rng = rng || Math.random;
  this.reset();
}
Engine.prototype.reset = function () {
  this.score = 0;            // 合計
  this.sceneScore = 0;       // 今の場面で取った点
  this.sceneIndex = 0;       // 何場面目か（0 始まり、周回込み）
  this.streak = 0;
  this.maxD = 0;
  this.maxTier = 1;
  this.popped = 0;
  this.merges = 0;
  this.time = 0;
  this.over = false;
  this.current = null;       // {d, B, t}
  this.flying = [];          // {id,x,y,x0,y0,d,t,tier,wob}
  this.events = [];
  this.wind = 0; this.windTarget = 0; this.windTimer = 0;
  this._nextId = 1;
  this._startScene(0);
};
Engine.prototype.scene = function () { const S = this.D.SCENES; return S[this.sceneIndex % S.length]; };
Engine.prototype.sceneNeed = function () {
  const S = this.D.SCENES, loop = Math.floor(this.sceneIndex / S.length);
  return Math.round(this.scene().need * Math.pow(this.D.LOOP_NEED_MULT, loop));
};
Engine.prototype._startScene = function (idx) {
  this.sceneIndex = idx;
  this.sceneScore = 0;
  this.remaining = this.D.BUBBLES_PER_SCENE;
  this.streak = 0;
  this._newWindTarget(true);
  this.events.push({ type: 'scene', index: idx, scene: this.scene(), need: this.sceneNeed() });
};
Engine.prototype.resize = function (W, H) {
  const sx = W / this.W, sy = H / this.H;
  for (const b of this.flying) { b.x *= sx; b.y *= sy; b.x0 *= sx; b.y0 *= sy; }
  this.W = W; this.H = H;
};
Engine.prototype._newWindTarget = function (first) {
  const D = this.D, s = this.scene();
  const r = s.windLo + (s.windHi - s.windLo) * this.rng();
  this.windTarget = r * D.WIND_MAX * s.windScale;
  if (first) this.wind = this.windTarget;
  this.windTimer = D.WIND_HOLD_MIN + (D.WIND_HOLD_MAX - D.WIND_HOLD_MIN) * this.rng();
  if (this.windTarget < 0) this.windTimer *= D.WIND_LEFT_HOLD;
};
Engine.prototype.strawX = function () { return this.W * this.D.STRAW_X; };
Engine.prototype.strawY = function () { return this.H * this.D.STRAW_Y; };
Engine.prototype.groundY = function () { return this.H * this.D.GROUND_Y; };
Engine.prototype.bandOf = function (x) {
  const D = this.D, r = x / this.W;
  return r >= D.BAND_FAR ? 2 : r >= D.BAND_MID ? 1 : 0;
};
Engine.prototype.streakMult = function () {
  const D = this.D;
  if (this.streak <= 0) return 1;
  return Math.min(D.STREAK_CAP, 1 + D.STREAK_STEP * (this.streak - 1));
};
Engine.prototype.cueLevel = function () {
  const c = this.current; if (!c) return 0;
  const D = this.D, p = c.d / c.B;
  return p >= D.CUE_THIN ? 4 : p >= D.CUE_SHAKE2 ? 3 : p >= D.CUE_SHAKE1 ? 2 : p >= D.CUE_COLOR ? 1 : 0;
};
Engine.prototype.canPress = function () {
  return !this.over && !this.current && this.remaining > 0 && this.flying.length < this.D.MAX_AIRBORNE;
};
Engine.prototype.press = function () {
  if (!this.canPress()) return false;
  const D = this.D, s = this.scene();
  this.current = { d: D.D_MIN, B: s.burst[0] + (s.burst[1] - s.burst[0]) * this.rng(), t: 0 };
  return true;
};
Engine.prototype.release = function () {
  const c = this.current; if (!c) return false;
  this.current = null;
  this.remaining--;
  const b = { id: this._nextId++, x: this.strawX() + c.d / 2 - 4, y: this.strawY() - c.d / 2 + 6, d: c.d, t: 0, tier: 1, wob: this.rng() * 6.28 };
  b.x0 = b.x; b.y0 = b.y;
  this.flying.push(b);
  this.events.push({ type: 'launch', d: c.d, x: b.x, y: b.y });
  return true;
};
Engine.prototype._pop = function () {
  const c = this.current; this.current = null;
  this.remaining--;
  this.popped++;
  this.streak = 0;
  this.events.push({ type: 'pop', d: c.d, x: this.strawX() + c.d / 2 - 4, y: this.strawY() - c.d / 2 + 6 });
  this._checkSceneEnd();
};
Engine.prototype._checkSceneEnd = function () {
  if (this.over || this.remaining > 0 || this.current || this.flying.length > 0) return;
  if (this.sceneScore >= this.sceneNeed()) {
    this.events.push({ type: 'clear', index: this.sceneIndex, sceneScore: this.sceneScore });
    this._startScene(this.sceneIndex + 1);
  } else {
    this.over = true;
    this.events.push({ type: 'over' });
  }
};
Engine.prototype.step = function (dt) {
  if (this.over) return;
  const D = this.D;
  this.time += dt;
  // 風
  this.windTimer -= dt;
  if (this.windTimer <= 0) this._newWindTarget(false);
  this.wind += (this.windTarget - this.wind) * Math.min(1, dt / D.WIND_LERP);
  // ふくらませ中
  const c = this.current;
  if (c) {
    c.t += dt;
    c.d = Math.min(D.D_MAX, c.d + D.INFLATE_RATE * dt);
    if (c.d >= c.B) this._pop();
  }
  // 飛行
  const T = D.FLIGHT_TIME, gy = this.groundY();
  for (const b of this.flying) {
    b.t += dt;
    const u = Math.min(1, b.t / T);
    b.y = b.y0 - this.H * D.RISE_HEIGHT * Math.sin(Math.PI * u) + (gy - b.d / 2 - b.y0) * u;
    b.x += this.wind * (b.d / 100) * dt;
    if (b.x < b.d / 2) b.x = b.d / 2;
    if (b.x > this.W - b.d / 2) b.x = this.W - b.d / 2;
  }
  // 合体（空中で触れた2つ）
  for (let i = 0; i < this.flying.length; i++) {
    for (let j = i + 1; j < this.flying.length; j++) {
      const a = this.flying[i], b = this.flying[j];
      if (a.tier + b.tier > D.MERGE_MAX_TIER) continue;
      const dx = a.x - b.x, dy = a.y - b.y, dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < (a.d + b.d) / 2 * D.MERGE_TOUCH) {
        const nd = Math.min(D.MERGE_D_CAP, Math.cbrt(a.d ** 3 + b.d ** 3));
        const wa = a.d ** 3, wb = b.d ** 3, ws = wa + wb;
        const m = { id: this._nextId++, x: (a.x * wa + b.x * wb) / ws, y: (a.y * wa + b.y * wb) / ws, d: nd, tier: a.tier + b.tier, wob: 0 };
        // 進み具合は先に飛んだほう（大きい t）に合わせ、そこから同じ式で続ける
        m.t = Math.max(a.t, b.t);
        const u = Math.min(1, m.t / T);
        // 現在の y から逆算して y0 を決める（式の連続性を保つ）
        m.y0 = (m.y + this.H * D.RISE_HEIGHT * Math.sin(Math.PI * u) - (gy - nd / 2) * u) / (1 - u || 1e-6);
        if (u >= 0.999) m.y0 = m.y;
        m.x0 = m.x;
        this.flying.splice(j, 1); this.flying.splice(i, 1);
        this.flying.push(m);
        this.merges++;
        if (m.tier > this.maxTier) this.maxTier = m.tier;
        this.events.push({ type: 'merge', x: m.x, y: m.y, d: nd, tier: m.tier });
        i = -1; break;
      }
    }
  }
  // 着地
  for (let i = this.flying.length - 1; i >= 0; i--) {
    const b = this.flying[i];
    if (b.t >= T) {
      this.flying.splice(i, 1);
      this.streak++;
      const band = this.bandOf(b.x);
      const mult = this.scene().bandMult[band];
      const tm = D.TIER_MULT[b.tier - 1] || 1;
      const sm = this.streakMult();
      const pts = Math.round(b.d * mult * tm * sm);
      this.score += pts; this.sceneScore += pts;
      if (b.d > this.maxD) this.maxD = b.d;
      this.events.push({ type: 'land', x: b.x, y: b.y, d: b.d, band, mult, tier: b.tier, streak: this.streak, sm, pts });
    }
  }
  this._checkSceneEnd();
};
// 今の風が続いたときの着地点（予兆の表示用）
Engine.prototype.predictX = function (d) {
  const x0 = this.strawX() + d / 2 - 4;
  let x = x0 + this.wind * (d / 100) * this.D.FLIGHT_TIME;
  return Math.max(d / 2, Math.min(this.W - d / 2, x));
};
Engine.prototype.takeEvents = function () { const e = this.events; this.events = []; return e; };
if (typeof module !== 'undefined') module.exports = Engine;

// game.js — 描画・入力・音・画面遷移。engine.js の状態を描くだけ。
// 公開 API: BubbleGame.mount(rootElement, {homeUrl}) / BubbleGame.unmount()
const BubbleGame = (function () {
  const D = DATA;
  const KEY_BEST = 'uchu.' + D.GAME_ID + '.best';
  const KEY_MUTE = 'uchu.' + D.GAME_ID + '.mute';

  let root = null, opts = {}, els = {}, ctx = null, engine = null;
  let raf = 0, lastT = 0, running = false, paused = false, started = false;
  let pointerId = null, hue = 0, particles = [], floats = [], fluff = [], rings = [], confetti = [], trails = [];
  let shakeSeed = 0, shake = 0, resetArmed = false, resetTimer = 0;
  let dpr = 1, W = 0, H = 0;
  let listeners = [];
  let scenePrev = null, sceneFade = 1, sceneBanner = null, bgImgs = {};

  // ---------- 保存 ----------
  function load(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ---------- 音（WebAudio 合成） ----------
  const audio = { ac: null, muted: !!load(KEY_MUTE, false), inflOsc: null, inflGain: null };
  function ac() {
    if (!audio.ac) { try { audio.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio.ac = null; } }
    if (audio.ac && audio.ac.state === 'suspended') audio.ac.resume();
    return audio.ac;

  function tone(freq, dur, type, vol, when) {
    const a = ac(); if (!a || audio.muted) return;

  // ---------- 描画 ----------
  function drawBubble(x, y, d, cueLevel, tier, wob, t) {
    const r = d / 2;

        ctx.fillStyle = 'rgba(255,255,255,0.85)'; [[0.15, 0.3, 1], [0.6, 0.42, 0.8], [0.35, 0.55, 0.6]].forEach(([cx, cy, k]) => { for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(W * cx + i * 22 * k + Math.sin(tm * 0.2 + cx) * 8, H * cy + (i % 2) * -10 * k, 18 * k, 0, 6.29); ctx.fill(); } }); }

        ctx.fillStyle = 'rgba(60,30,80,0.6)'; for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(W * (0.1 + i * 0.18) + Math.sin(tm * 0.15 + i) * 10, H * (0.25 + (i % 3) * 0.08), 60, 10, 0, 0, 6.29); ctx.fill(); } }

  function draw(dt) {
