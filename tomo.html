<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>トモシビ</title><style>
html,body{margin:0;padding:0;background:#0b1020;color:#e8ecf4;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{position:fixed;inset:0;width:100%;height:100%}
.tm-wrap{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:#0b1020}
.tm-canvas{position:absolute;inset:0;display:block;touch-action:none}
.tm-hud{position:absolute;top:0;left:0;right:0;height:58px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;box-sizing:border-box;pointer-events:none}
.tm-hud>*{pointer-events:auto}
.tm-score{display:flex;align-items:baseline;gap:5px}
.tm-snum{font-size:38px;font-weight:800;color:#ffd166;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.tm-sunit{font-size:14px;color:#c9d0dd}
.tm-right{display:flex;align-items:center;gap:8px}
.tm-best{font-size:13px;color:#c9d0dd;background:rgba(255,255,255,.08);padding:6px 10px;border-radius:14px}
.tm-best b{color:#fff;font-size:15px}
.tm-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:16px;cursor:pointer}
.tm-msg{position:absolute;left:50%;top:64px;transform:translate(-50%,-6px);background:rgba(0,0,0,.62);color:#fff;padding:8px 14px;border-radius:16px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:5}
.tm-msg.on{opacity:1;transform:translate(-50%,0)}
.tm-ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:rgba(8,12,24,.86);backdrop-filter:blur(3px);overflow:auto}
.tm-ov[hidden],.tm-wrap [hidden]{display:none!important}
.tm-title{background-size:cover;background-position:center;justify-content:flex-start;padding-top:min(18vh,140px)}
.tm-title .tm-tbody{background:rgba(6,10,22,.55);border-radius:18px;padding:18px 20px 22px;max-width:360px}
.tm-logo{font-size:56px;font-weight:900;letter-spacing:.1em;color:#ffd166;text-shadow:0 4px 24px rgba(255,209,102,.45),0 0 60px rgba(255,170,40,.35)}
.tm-sub{font-size:16px;margin:8px 0 4px;color:#fff}
.tm-sub2{font-size:13px;color:#c8cfdd;line-height:1.6;margin-bottom:22px}
.tm-big{font-size:18px;font-weight:700;padding:14px 40px;border-radius:30px;border:0;background:#ffd166;color:#1a1400;cursor:pointer;box-shadow:0 6px 18px rgba(255,209,102,.3)}
.tm-big:active{transform:scale(.97)}
.tm-link{display:inline-block;margin-top:18px;color:#c9d0dd;font-size:14px;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:8px 16px;border-radius:20px}
.tm-rlabel{font-size:14px;color:#b8c0d0}
.tm-rnum{font-size:72px;font-weight:900;color:#ffd166;line-height:1.1}
.tm-rbest{font-size:16px;color:#fff;margin-bottom:14px}
.tm-cause{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;max-width:360px;margin-bottom:14px}
.tm-ctitle{font-weight:800;font-size:16px;color:#ff8a7a;margin-bottom:4px}
.tm-cause.good .tm-ctitle{color:#8fe3a1}
.tm-ctext{font-size:13px;color:#e8ecf4;line-height:1.55}
.tm-seq{display:flex;flex-direction:column;gap:4px;align-items:center;max-width:360px;margin-bottom:18px}
.tm-seqlabel{font-size:11px;color:#b8c0d0;margin-bottom:2px}
.tm-branch{display:flex;gap:3px;align-items:center;background:rgba(255,255,255,.05);border-radius:8px;padding:3px 8px}
.tm-branch img{width:26px;height:26px;object-fit:contain}
.tm-branch img.bad{opacity:.35;filter:grayscale(1)}
.tm-branch .tm-wire{width:14px;height:2px;background:#c8823a;border-radius:1px}
.tm-htitle{font-size:20px;font-weight:800;margin-bottom:10px}
.tm-hbody{max-width:380px;text-align:left;font-size:13px;line-height:1.5;max-height:60vh;overflow:auto;margin-bottom:14px}
.tm-hsec{font-weight:800;color:#ffd166;margin:10px 0 4px}
.tm-hrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.tm-hrow b{min-width:70px}
.tm-hrow span:last-child{color:#b8c0d0;font-size:12px}
.tm-hrow img{width:30px;height:30px;object-fit:contain;flex:none}
.tm-hp{color:#e8ecf4;margin-bottom:6px}

.tm-howto{justify-content:center}
.tm-hwcard{background:rgba(10,16,34,.92);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px 20px 18px;max-width:380px;width:100%;box-sizing:border-box;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.tm-hwdots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.tm-hwdots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.tm-hwdots span.on{background:#ffd166}
.tm-hwtitle{font-size:19px;font-weight:800;color:#ffd166;margin-bottom:12px;text-wrap:balance}
.tm-hwtext{font-size:14px;line-height:1.7;color:#e8ecf4;margin-top:12px}
.tm-hwtext b{color:#fff}
.tm-fig{display:flex;align-items:center;justify-content:center;gap:6px;min-height:96px}
.tm-fig img{width:76px;height:76px;object-fit:contain}
.tm-fig img.sm,.tm-figrow img{width:52px;height:52px}
.tm-figrow img.dim{opacity:.55}
.tm-fig2{display:flex;gap:10px;justify-content:center}
.tm-fig2>div{flex:1;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 4px}
.tm-figrow{display:flex;align-items:center;justify-content:center;gap:2px;border-bottom:2px solid #c8823a;padding-bottom:2px;margin:0 8px 6px}
.tm-w{display:inline-block;width:18px;height:2px;background:#c8823a}
.tm-figcap{font-size:11.5px;color:#c8cfdd;line-height:1.5;margin-top:4px}
.tm-hwbtns{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}
.tm-skip{background:none;border:0;color:#9aa3b5;font-size:13px;cursor:pointer;padding:8px}
.tm-hwbtns .tm-big{padding:12px 30px;font-size:16px}

.tm-modes{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.tm-mode{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;box-sizing:border-box;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,209,102,.35);background:rgba(255,209,102,.1);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tm-mode:active{transform:scale(.98)}
.tm-mode b{font-size:19px;color:#ffd166}
.tm-mode span{font-size:12px;color:#c8cfdd;line-height:1.4}
.tm-mode em{font-style:normal;font-size:13px;color:#ffd166;letter-spacing:.1em}
.tm-mode.locked{opacity:.4;cursor:default}
.tm-difflist,.tm-stagelist{display:flex;flex-direction:column;gap:8px;max-height:56vh;overflow:auto}
.tm-stagelist .tm-mode{padding:9px 14px}
.tm-stagelist .tm-mode b{font-size:15px}
.tm-srstars{font-size:34px;color:#ffd166;letter-spacing:.15em;margin:4px 0 8px}
.tm-qpanel{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgba(6,10,22,.92);border-top:1px solid rgba(255,255,255,.1);padding:8px 12px 10px;box-sizing:border-box;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.tm-qpanel[hidden]{display:none!important}
.tm-qhead{display:flex;justify-content:space-between;font-size:11px;color:#9aa3b5}
.tm-qtext{font-size:14px;line-height:1.5;color:#fff;min-height:2.6em}
.tm-qans{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;background:rgba(255,255,255,.07);border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums}
.tm-qval{font-size:24px;font-weight:800;color:#ffd166;min-width:2ch;text-align:right}
.tm-qval.empty{color:rgba(255,209,102,.3)}
.tm-qunit{font-size:15px;color:#c8cfdd;min-width:1.5ch}
.tm-qpad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tm-key{height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:17px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tm-key:active{background:rgba(255,209,102,.25)}
.tm-keyok{grid-column:1/-1;background:#ffd166;color:#1a1400;border:0}
.tm-qplace{display:flex;align-items:center;gap:12px;justify-content:center;grid-column:1/-1;color:#fff;font-size:15px;padding:10px 0}
.tm-qplace img{width:56px;height:56px;object-fit:contain}
.tm-qplace small{color:#c8cfdd;font-size:12px}
.tm-qfb{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.tm-qfb[hidden]{display:none!important}
.tm-qmark{font-size:18px;font-weight:800}
.tm-qmark.ok{color:#8fe3a1}.tm-qmark.ng{color:#ff8a7a}
.tm-qexp{font-size:13px;line-height:1.55;color:#e8ecf4;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 10px}
.tm-qfb .tm-big{padding:11px 30px;font-size:16px;align-self:center}
.tm-menulist{display:flex;flex-direction:column;gap:8px}
.tm-menulist a.tm-mode{text-decoration:none}
.tm-menuov{z-index:7}
.tm-qintro{display:block;font-size:12.5px;color:#c8cfdd;line-height:1.5;margin-bottom:3px}
.tm-qpart{display:block;font-size:15px;font-weight:700;color:#fff}
.tm-qtext{min-height:3.4em}
.tm-calcbtn{position:absolute;left:10px;bottom:10px;z-index:8;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);font-size:17px;cursor:pointer}
.tm-calc{position:absolute;left:10px;bottom:50px;z-index:8;width:220px;background:rgba(10,16,34,.96);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px}
.tm-calcdisp{background:rgba(255,255,255,.07);border-radius:8px;padding:6px 10px;text-align:right;font-variant-numeric:tabular-nums}
.tm-calcexpr{font-size:12px;color:#9aa3b5;min-height:1.2em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tm-calcval{font-size:22px;font-weight:800;color:#ffd166}
.tm-calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tm-ck{height:34px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.tm-ckop{background:rgba(255,209,102,.12);color:#ffd166}
.tm-ckeq{background:#ffd166;color:#1a1400;border:0}
.tm-calcfoot{display:flex;justify-content:space-between;gap:6px}
.tm-calcfoot button{flex:1;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e8ecf4;font-size:12px;cursor:pointer}
.tm-resumebtn{border-color:#8fe3a1;background:rgba(143,227,161,.12)}
.tm-resumebtn b{color:#8fe3a1}
.tm-seqnote{font-size:11px;color:#9aa3b5;margin-top:4px}
</style></head><body>

      if (!res.ok) {
        state = 'fail'; failT = 0;
        if (res.kind === 'burn') { audio.pop(); flash = 1; for (let k = 0; k < 14; k++) smoke.push(mkSmoke(res.dev)); }
        else if (res.kind === 'dark') { audio.fizzle(); }
        else { audio.fuse(); flash = 0.6; for (let k = 0; k < 24; k++) sparks.push({ x: L.meterX + L.meterS / 2, y: L.meterY + L.meterS / 2, vx: (Math.random() - .5) * 320, vy: -60 - Math.random() * 260, t: 0 }); }
        try { if (navigator.vibrate) navigator.vibrate([80, 40, 160]); } catch (e) { }
      } else {
        elS.textContent = game.score;
        if (game.over && game.cause === 'full') { state = 'fail'; failT = 0; audio.clear(); }
        else {
          state = 'offer';
          const c = game.circuit;
          if (c.I > c.battery.Imax * 0.8 && !warnBeeped) { showMsg('⚠ 電池の限界が近い', 1000); audio.warn(); warnBeeped = true; }
          if (c.I <= c.battery.Imax * 0.8) warnBeeped = false;
        }
      }
      power = null;
    }
    function mkSmoke(dev) {
      const p = devPos(dev);
      return { x: p.x + (Math.random() - .5) * 16, y: p.y - L.spr * 0.3, vx: (Math.random() - .5) * 20, vy: -30 - Math.random() * 40, t: 0, life: 1 + Math.random() };
    }
    function devPos(dev) {
      const c = game.circuit;
      for (let b = 0; b < c.branches.length; b++) { const k = c.branches[b].devices.indexOf(dev); if (k >= 0) return { x: devX(k), y: branchY(b) }; }
      return { x: W / 2, y: H / 2 };
    }

    function showResult() {
      resultShown = true; state = 'result'; audio.bgmStop();
      const n = game.score, isBest = n > best;
      if (isBest) { best = n; ls.set(bestKey(), String(best)); elBest.textContent = best; }
      $('.tm-result .tm-rnum').textContent = n;
      $('.tm-result .tm-rbest').textContent = isBest ? '🎉 ベスト更新！' : `ベスト ${best}`;
      const c = D.causes[game.cause] || D.causes.dark;
      $('.tm-result .tm-ctitle').textContent = c.title; $('.tm-result .tm-ctext').textContent = c.text;
      $('.tm-result .tm-cause').classList.toggle('good', game.cause === 'full');
      const cc = game.circuit;
      const key = d => d.type.id === 'bulb' ? (d.state === 'burn' ? 'bulb_burnt' : 'bulb_on') : d.type.id === 'led' ? (d.state === 'burn' ? 'led_burnt' : 'led_on') : d.type.id;
      // 数に入らなかった機器（壊れた／消えた機器と、最後に置いた機器）はうすく出す
      const failed = game.cause !== 'full';
      const counted = d => d.state === 'off' && !(failed && d === game.lastPlaced);
      $('.tm-result .tm-seq').innerHTML = `<span class="tm-seqlabel">電池 ${cc.battery.series}本直列 × ${cc.battery.parallel}並列　枝 ${cc.branches.length}本</span>` +
        cc.branches.map(b => '<div class="tm-branch">' + b.devices.map(d => IMG[key(d)] ? `<img class="${counted(d) ? '' : 'bad'}" src="${IMG[key(d)]}" alt="${d.type.name}">` : d.type.name).join('<span class="tm-wire"></span>') + '</div>').join('') +
        (failed ? '<span class="tm-seqnote">うすい部品は、ともらなかったので数に入りません</span>' : '');
      ovResult.hidden = false;
      if (isBest) setTimeout(() => audio.best(), 200);
    }

    on($('.tm-start'), 'click', () => showDiff());
    on($('.tm-hakaru'), 'click', () => showStages());
    on($('.tm-diffback'), 'click', () => { ovDiff.hidden = true; ovTitle.hidden = false; });
    on($('.tm-stback'), 'click', () => { ovStages.hidden = true; ovTitle.hidden = false; });
    on($('.tm-again'), 'click', () => newGame());
    on($('.tm-help'), 'click', () => { ovHelp.hidden = false; });
    const ovMenu = $('.tm-menuov');
    const menuOpen = () => {
      if (state === 'title' && !ovTitle.hidden) return;
      $('.tm-mbacksub').textContent = mode === 'hakaru' ? 'ステージ一覧へ。ここまでの進み具合は保存される' : '作業台の選択へ。いまのプレイは終わります';
      $('.tm-mtitlesub').textContent = mode === 'hakaru' ? '進み具合は保存される' : 'いまのプレイは終わります';
      ovMenu.hidden = false; paused = true; audio.humStop(); audio.bgmStop();
    };
    const menuClose = () => { ovMenu.hidden = true; paused = document.hidden; if (state === 'power' || (hk && hk.phase === 'power')) audio.humStart(); bgmSync(); };
    on($('.tm-menu'), 'click', () => ovMenu.hidden ? menuOpen() : menuClose());
    on($('.tm-mresume'), 'click', menuClose);
    on($('.tm-mtitle'), 'click', () => { ovMenu.hidden = true; if (mode === 'hakaru') saveHakaru(); goTitle(); });
    on($('.tm-mback'), 'click', () => { ovMenu.hidden = true; if (mode === 'hakaru') { saveHakaru(); goTitle(); showStages(); } else { goTitle(); showDiff(); } });
    on($('.tm-hclose'), 'click', () => { ovHelp.hidden = true; });
    on(btnMute, 'click', () => { btnMute.textContent = audio.toggle() ? '🔇' : '🔊'; });
    const btnBgm = $('.tm-bgm'); const bgmIcon = () => { btnBgm.textContent = '♪'; btnBgm.style.opacity = audio.bgmOn ? '1' : '.4'; btnBgm.style.textDecoration = audio.bgmOn ? '' : 'line-through'; }; bgmIcon();
    on(btnBgm, 'click', () => { audio.bgmToggle(); bgmIcon(); bgmSync(); });
    // BGM はゲームプレイ中だけ（タイトル・選択画面・結果・メニュー中は鳴らさない）
    const playing = () => (mode === 'tomosu' && game && !game.over && state !== 'result' && state !== 'title') || (mode === 'hakaru' && hk && !hk.finished);
    const bgmSync = () => { if (playing() && ovMenu.hidden && !document.hidden) audio.bgmStart(mode === 'hakaru' ? 'hakaru' : 'tomosu'); else audio.bgmStop(); };
    on(document, 'visibilitychange', () => { paused = document.hidden; if (paused) { audio.humStop(); audio.bgmStop(); } else { if (state === 'power') audio.humStart(); bgmSync(); } });
    on(root, 'keydown', e => {
      if (state === 'offer' && game && /^[1-3]$/.test(e.key)) { const i = +e.key - 1; if (game.slotsFor(game.offer[i]).length) { sel = i; computeSlots(); } }
      if (state === 'offer' && game && sel >= 0) {
        const slots = game.slotsFor(game.offer[sel]);
        if (e.key === 'n' || e.key === 'p') { const s = slots.find(s => s.kind === 'parallel' || s.kind === 'bat_parallel'); if (s) commit(sel, s); }
        if (/^[a-e]$/.test(e.key)) { const b = e.key.charCodeAt(0) - 97; const s = slots.find(s => s.kind === 'series' && s.branch === b); if (s) commit(sel, s); }
        if (e.key === 's') { const s = slots.find(s => s.kind === 'bat_series'); if (s) commit(sel, s); }
        if (e.key === 'Escape') { sel = -1; computeSlots(); }
      }
      if (e.key === 'Escape' && !(state === 'offer' && sel >= 0)) { if (ovMenu.hidden) menuOpen(); else menuClose(); return; }
      if (state === 'title' && ovTitle.hidden === false && (e.key === 'Enter' || e.key === ' ')) showDiff();
      if (mode === 'hakaru' && hk) { hakaruKey(e); return; }
      else if (state === 'title' && !ovHow.hidden && e.key === 'Enter') $('.tm-hwnext').click();
      if (state === 'result' && e.key === 'Enter') newGame();
    });

    // ---------- 更新 ----------
    function update(dt) {
      tNow += dt;
      if (mode === 'hakaru') { if (hk && hk.p) updateHakaru(dt); return; }
      if (!game) return;
      // 明るさの追従
      const target = new Map();
      // ヒューズが飛んだ（電池が限界）＝回路が切れるので、全部消える
      const blown = game.over && (game.cause === 'fuse' || game.cause === 'motor_fuse');
      if (game.circuit.solved) for (const d of game.circuit.allDevices()) target.set(d.uid, (blown || d.state !== 'off') ? 0 : E.Circuit.level(d));
      for (const [uid, tv] of target) {
        const cur = levels.has(uid) ? levels.get(uid) : 0;
        const rate = state === 'power' ? 1.6 : 4;
        levels.set(uid, cur + (tv - cur) * Math.min(1, dt * rate));
      }
      // 羽
      for (const d of game.circuit.allDevices()) if (d.type.id === 'motor') {
        const lv = levels.get(d.uid) || 0; const a = propAngle.get(d.uid) || 0;
        propAngle.set(d.uid, a + dt * (0.5 + lv * 14) * (d.state === 'off' && !blown ? 1 : 0));
      }
      // 針（ばね）
      const targetI = (state === 'power' || state === 'fail' || state === 'result' || state === 'offer') && game.circuit.solved ? game.circuit.I : 0;
      const k = 40, cdamp = 7;
      needleV += (k * (targetI - needle) - cdamp * needleV) * dt; needle += needleV * dt;
      if (state === 'fly') { fly.t += dt / 0.3; if (fly.t >= 1) startPower(); }
      else if (state === 'power') {
        if (paused) return;
        power.t += dt;
        audio.humLevel(0.05 + Math.min(0.2, game.circuit.I * 0.15));
        if (power.t >= D.POWER_SEC) finishPower();
      } else if (state === 'fail') {
        failT += dt;
        if (failT > D.FAIL_SEC && !resultShown) showResult();
      }
      flash = Math.max(0, flash - dt * 2.5);
      for (const s of smoke) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.98; }
      smoke = smoke.filter(s => s.t < s.life);
      for (const s of sparks) { s.t += dt; s.vy += 500 * dt; s.x += s.vx * dt; s.y += s.vy * dt; }
      sparks = sparks.filter(s => s.t < 0.9);
    }

    // ---------- 描画 ----------
    function drawImg(key, x, y, s, alpha, rot) {
      if (!has(key)) return false;
      ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.translate(x, y); if (rot) ctx.rotate(rot);
      ctx.drawImage(images[key], -s / 2, -s / 2, s, s); ctx.restore(); return true;
    }
    function drawDevice(dev, x, y, s, lvOverride) {
      const lv = lvOverride != null ? lvOverride : (levels.get(dev.uid) || 0);
      const id = dev.type.id;
      if (id === 'bulb' || id === 'led') {
        const on = id + '_on', off = id + '_off', burnt = id + '_burnt';
        if (dev.state === 'burn') { drawImg(burnt, x, y, s) || fallback(dev, x, y, s, 0); return; }
        if (lv > 0.15) { // 後光
          const g = ctx.createRadialGradient(x, y - s * 0.15, 2, x, y - s * 0.15, s * (0.5 + lv * 0.4));
          const col = id === 'bulb' ? '255,190,80' : '90,200,255';
          g.addColorStop(0, `rgba(${col},${0.35 * lv})`); g.addColorStop(1, `rgba(${col},0)`);
          ctx.fillStyle = g; ctx.fillRect(x - s, y - s, s * 2, s * 2);
        }
        if (!drawImg(off, x, y, s)) fallback(dev, x, y, s, lv);
        // まぶしいときのちらつき
        let a = lv;
        if (dev.state === 'off' && dev.I > dev.type.imax * 0.85) a *= 0.8 + 0.2 * Math.sin(tNow * 40);
        if (a > 0.01) drawImg(on, x, y, s, clamp(a, 0, 1));
        if (dev.state === 'dark') { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, Math.PI * 2); ctx.fill(); }
      } else if (id === 'motor') {
        if (!drawImg('motor', x, y, s)) fallback(dev, x, y, s, lv);
        const ang = propAngle.get(dev.uid) || 0;
        const px = x - s * 0.30, py = y - s * 0.02;
        if (!drawImg('prop', px, py, s * 0.52, dev.state === 'dark' ? 0.5 : 1, ang)) { ctx.fillStyle = '#ff5a2a'; ctx.beginPath(); ctx.arc(px, py, s * 0.2, 0, Math.PI * 2); ctx.fill(); }
        if (dev.state === 'dark') { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, Math.PI * 2); ctx.fill(); }
      } else {
        if (!drawImg('resistor', x, y, s)) fallback(dev, x, y, s, 0);
      }
    }
    function fallback(dev, x, y, s, lv) {
      const col = { bulb: '#ffd166', led: '#6fd3ff', motor: '#b0b8c8', resistor: '#d8b98a' }[dev.type.id] || '#fff';
      ctx.fillStyle = col; ctx.globalAlpha = 0.4 + lv * 0.6; ctx.beginPath(); ctx.arc(x, y, s * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff'; ctx.font = `${Math.max(10, s * 0.18)}px system-ui`; ctx.textAlign = 'center'; ctx.fillText(dev.type.name, x, y + s * 0.45);
    }
    function drawItem(type, x, y, s) {
      const key = type.id === 'bulb' ? 'bulb_off' : type.id === 'led' ? 'led_off' : type.id;
      if (!drawImg(key, x, y, s)) fallback({ type }, x, y, s, 0.3);
      if (type.id === 'motor') drawImg('prop', x - s * 0.30, y - s * 0.02, s * 0.52);
    }
    function wire(x0, y0, x1, y1, w) {
      ctx.strokeStyle = '#c8823a'; ctx.lineWidth = w || 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    // 電流の粒：線分上に I に比例した密度で
    function dots(x0, y0, x1, y1, I, dir) {
      if (I <= 0.005) return;
      const len = Math.hypot(x1 - x0, y1 - y0); if (len < 4) return;
      const per100 = clamp(I * 9, 0.6, 14);
      const spacing = 100 / per100;
      const off = ((tNow * 70) % spacing) * (dir || 1);
      ctx.fillStyle = 'rgba(255,220,120,0.95)';
      for (let d = ((off % spacing) + spacing) % spacing; d < len; d += spacing) {
        const t = d / len; const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }

    function draw() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      // 背景
      if (has('bg')) {
        const im = images.bg, sc = Math.max(W / im.naturalWidth, H / im.naturalHeight);
        const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
        ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      } else { ctx.fillStyle = '#0d1630'; ctx.fillRect(0, 0, W, H); }
      // トレイの台
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(0, L.trayTop, W, L.trayH);
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(0, L.trayTop, W, 1);
      if (mode === 'hakaru') { if (hk) drawHakaru(); return; }
      if (!game) return;
      const c = game.circuit;
      // ヒューズが飛んだら電流は流れない（粒を止める）
      const blownNow = game.over && (game.cause === 'fuse' || game.cause === 'motor_fuse');
      const powered = c.solved && !blownNow;
      const nB = c.branches.length;
      const lastY = nB ? branchY(nB - 1) : L.busY;

      // ---- 配線 ----
      const topY = L.busY - 6;
      const wy = L.wireY, mR = L.meterX + L.meterS, mL = L.meterX, bL = L.batX - c.battery.series * 13, bR = L.batX + c.battery.series * 13;
      wire(L.railL, wy, L.railL, lastY); // 左レール
      wire(L.railR, wy, L.railR, lastY); // 右レール
      wire(mL, wy, L.railL, wy);          // 電流計 → 左レール
      wire(bL, wy, mR, wy);               // 電池 → 電流計
      wire(bR, wy, L.railR, wy);          // 電池 → 右レール
      c.branches.forEach((b, i) => { const y = branchY(i); wire(L.railL, y, L.railR, y); });
      // ---- 粒 ----
      if (powered && state !== 'title') {
        let below = c.I;
        let prevY = L.wireY;
        for (let i = 0; i < nB; i++) {
          const y = branchY(i);
          dots(L.railL, prevY, L.railL, y, below, 1);      // 左レールを下る
          dots(L.railR, y, L.railR, prevY, below, 1);      // 右レールを上る
          dots(L.railL, y, L.railR, y, c.branches[i].I, 1); // 枝
          below -= c.branches[i].I; prevY = y;
        }
        dots(bL, L.wireY, mR, L.wireY, c.I, -1); dots(mL, L.wireY, L.railL, L.wireY, c.I, -1);
        dots(L.railR, L.wireY, bR, L.wireY, c.I, -1);
      }
      // ---- 機器 ----
      c.branches.forEach((b, i) => {
        const y = branchY(i);
        b.devices.forEach((d, k) => {
          if (state === 'fly' && false) return;
          const x = devX(k);
          drawDevice(d, x, y, L.spr);
          // 電圧の取り分バー
          if (powered) {
            const frac = clamp(d.V / c.battery.E, 0, 1), bw = L.spr * 0.7;
            ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x - bw / 2, y + L.spr * 0.46, bw, 3);
            ctx.fillStyle = 'rgba(255,209,102,0.85)'; ctx.fillRect(x - bw / 2, y + L.spr * 0.46, bw * frac, 3);
          }
        });
      });
      // ---- 電池 ----
      drawBattery(c);
      // ---- 電流計 ----
      drawMeter(c);
      // ---- 置き場 ----
      if (state === 'offer' && sel >= 0) {
        for (const h of hitSlots) {
          const pulse = 0.6 + 0.4 * Math.sin(tNow * 5);
          ctx.strokeStyle = `rgba(255,209,102,${0.5 + 0.5 * pulse})`; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
          ctx.beginPath(); ctx.arc(h.x, h.y, h.r * 0.9, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = `rgba(255,209,102,${0.08 + 0.08 * pulse})`; ctx.fill();
          ctx.fillStyle = '#ffd166'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(h.label, h.x, h.y + h.r * 0.9 + 14);
          ctx.font = 'bold 20px system-ui, sans-serif'; ctx.fillText('＋', h.x, h.y + 7);
        }
      }
      // ---- 飛んでいる部品 ----
      if (state === 'fly' && fly) {
        const t = ease(clamp(fly.t, 0, 1));
        const x = fly.from.x + (fly.to.x - fly.from.x) * t, y = fly.from.y + (fly.to.y - fly.from.y) * t - Math.sin(t * Math.PI) * 60;
        drawItem(fly.item.type, x, y, L.spr * (0.9 + 0.3 * Math.sin(t * Math.PI)));
      }
      // ---- 通電の文字 ----
      if (state === 'power') {
        ctx.fillStyle = 'rgba(255,220,120,0.95)'; ctx.font = 'bold 20px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('通電…', W / 2, L.trayTop - 14);
      }
      // ---- 失敗の印 ----
      if ((state === 'fail' || state === 'result') && game.fail) {
        const r = game.fail;
        ctx.fillStyle = 'rgba(255,90,70,0.95)'; ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign = 'center';
        if (r.dev) { const p = devPos(r.dev); ctx.fillText(r.kind === 'burn' ? '✕ 切れた' : '✕ 消えた', p.x, p.y - L.spr * 0.55); }
        else ctx.fillText('✕ ヒューズが飛んだ', L.meterX + L.meterS / 2, L.meterY + L.meterS + 30);
      }
      if (state === 'fail' && game.cause === 'full') {
        ctx.fillStyle = '#8fe3a1'; ctx.font = 'bold 20px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('作業台がいっぱい！', W / 2, L.trayTop - 14);
      }
      // 煙・火花
      for (const s of smoke) { ctx.fillStyle = `rgba(120,120,130,${0.5 * (1 - s.t / s.life)})`; ctx.beginPath(); ctx.arc(s.x, s.y, 4 + s.t * 10, 0, Math.PI * 2); ctx.fill(); }
      for (const s of sparks) { ctx.fillStyle = `rgba(255,${200 - s.t * 150 | 0},60,${1 - s.t})`; ctx.fillRect(s.x, s.y, 3, 3); }
      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
      // ---- トレイ ----
      drawTray();
    }

    function drawBattery(c) {
      const cw = 22, ch = 46, gap = 4;
      const cols = c.battery.series, rows = c.battery.parallel;
      const x0 = L.batX - cols * (cw + gap) / 2 + gap / 2;
      for (let r = rows - 1; r >= 0; r--) for (let k = 0; k < cols; k++) {
        const x = x0 + k * (cw + gap) + cw / 2 + r * 5, y = L.batY + ch / 2 - r * 5;
        if (!drawImg('battery', x, y, ch)) { ctx.fillStyle = '#f2b632'; ctx.fillRect(x - cw / 2, y - ch / 2, cw, ch); }
      }
      ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(c.battery.E >= 50 ? '電源（コンセント）' : `電池 ${cols}本直列${rows > 1 ? ' × ' + rows + '並列' : ''}`, L.batX, L.batY + ch + 13);
    }
    function drawMeter(c) {
      const s = L.meterS, cx = L.meterX + s / 2, cy = L.meterY + s / 2;
      const full = D.START_IMAX + D.PAR_IMAX * (D.MAX_CELLS - 1);
      const a0 = -Math.PI * 2 / 3, a1 = Math.PI * 2 / 3; // -120°..+120°（0 が上）
      const ang = v => a0 + (a1 - a0) * clamp(v / full, 0, 1.03);
      const hot = c.solved && c.I > c.battery.Imax * 0.8 && state !== 'result';
      const blink = hot && Math.floor(tNow * 6) % 2 === 0;
