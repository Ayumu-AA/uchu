<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ブクブク商店</title>
<style>html,body{margin:0;height:100%;background:#0f1626;overflow:hidden}#buku-root{height:100%}</style>
<style>.buku{--bg:#0f1626;--panel:#182238;--panel2:#1f2b46;--text:#e9eef8;--sub:#9aa7c2;--acc:#ffb347;--ok:#7ee787;--bad:#ff6b6b;--line:#2a3550;
  position:relative;width:100%;height:100%;min-height:100svh;background:var(--bg);color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
.buku *{box-sizing:border-box}
.buku [hidden]{display:none!important}
.buku button{font-family:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;font-size:14px;cursor:pointer}
.buku button:disabled{opacity:.35;cursor:default}
.buku button.on{border-color:var(--acc);background:#3a2f1c;color:#ffe2b0}
.buku button.primary{background:var(--acc);color:#1a1200;font-weight:700;border-color:transparent;font-size:17px;padding:12px 18px}
.buku .screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.buku .screen[hidden]{display:none}
/* header */
.buku .hd{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);font-size:13px;flex:0 0 auto}
.buku .hd .ttl{font-weight:700;font-size:14px;color:var(--acc);white-space:nowrap}
.buku .hd .stat{white-space:nowrap}
.buku .hd .sp{flex:1}
.buku .hd .stat b{color:#fff;font-size:15px}
.buku .hd .hearts{letter-spacing:2px}
.buku .icon{border:none;background:transparent;font-size:18px;padding:2px 6px}
/* orders */
.buku .orders{display:flex;gap:6px;padding:8px 8px 4px;flex:0 0 auto}
.buku .card{flex:1 1 0;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 6px 5px;font-size:12px;line-height:1.3;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:86px}
.buku .card.sel{border-color:var(--acc);background:#2b2a24}
.buku .card.nomat{opacity:.55}
.buku .card .face{font-size:18px;line-height:1}
.buku .card .txt{flex:1;color:var(--text)}
.buku .card .tool{color:var(--sub);font-size:10.5px}
.buku .card .pat{display:flex;gap:2px;height:5px}
.buku .card .pat i{flex:1;background:#33405f;border-radius:2px}
.buku .card .pat i.on{background:var(--ok)}
.buku .card .pat i.low{background:var(--bad)}
.buku .card .tag{position:absolute;top:-8px;right:6px;background:var(--bad);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
/* bench */
.buku .bench{position:relative;flex:0 0 auto;height:min(36vh,260px);min-height:132px;margin:0 8px;background:#0b1120;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.buku .bench canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.buku .msg{padding:4px 10px;font-size:12.5px;line-height:1.35;color:#ffe2b0;min-height:36px;flex:0 0 auto}
.buku .msg.bad{color:#ffb4b4}.buku .msg.good{color:#c9f5cf}
/* panel / steps */
.buku .panel{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:4px 0 6px}
.buku .stepbar{display:flex;gap:6px;padding:0 8px}
.buku .stepbar .st{flex:1;font-size:12px;padding:6px 4px;color:var(--sub);background:transparent}
.buku .stepbar .st.on{color:#ffe2b0;border-color:var(--acc);background:#3a2f1c}
.buku .stepbar .st.done{color:var(--ok);border-color:#2f5a3a}
.buku .hint{padding:0 12px;font-size:12px;color:var(--sub);line-height:1.35;min-height:32px}
.buku .stepbody{display:flex;flex-direction:column;gap:6px}
.buku .stepbody[hidden]{display:none}
/* shelf */
.buku .shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 8px;flex:0 0 auto}
.buku .rg{position:relative;padding:5px 2px;font-size:11px;line-height:1.15;white-space:pre-line;height:44px;display:flex;align-items:center;justify-content:center;text-align:center}
.buku .rg.liquid{border-style:dashed}
.buku .rg.pic{flex-direction:column;gap:1px;height:62px;padding:3px 2px}
.buku .rg.pic img{height:32px;width:auto;max-width:90%;object-fit:contain}
.buku .rg.pic .nm{font-size:9.5px;line-height:1.05}
.buku .rg .bd{position:absolute;top:-6px;right:-4px;background:#3a4a6e;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.buku .rg .bd.inf{background:#4a3a1c;color:var(--acc)}
.buku .rg.out{opacity:.3}
.buku .rg.flash .bd{animation:bkflash .6s}
@keyframes bkflash{0%{transform:scale(1)}50%{transform:scale(1.6);background:var(--acc);color:#000}100%{transform:scale(1)}}
.buku .ctl{display:flex;gap:6px;padding:6px 8px 0;flex:0 0 auto;align-items:center;flex-wrap:wrap}
.buku .ctl .lb{font-size:11px;color:var(--sub);width:100%;margin-bottom:-3px}
.buku .ctl button{font-size:12.5px;padding:7px 8px;flex:1 1 0}
.buku .ctl .chk{font-size:12px;display:flex;align-items:center;gap:4px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;flex:2 1 0;background:var(--panel)}
.buku .ctl .chk.on{border-color:var(--acc);color:#ffe2b0;background:#3a2f1c}
.buku .act{display:flex;gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));flex:0 0 auto;align-items:center}
.buku .act .primary{flex:3}
.buku .act .wait{flex:1;font-size:13px}
/* overlays */
.buku .ov{position:absolute;inset:0;background:rgba(5,8,16,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.buku .ov[hidden]{display:none}
.buku .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:92%;overflow:auto;font-size:13.5px;line-height:1.5}
.buku .box h2{margin:0 0 10px;font-size:17px;color:var(--acc)}
.buku .box h3{margin:12px 0 4px;font-size:14px;color:#ffe2b0}
.buku .box table{border-collapse:collapse;width:100%;font-size:12px}
.buku .box td,.buku .box th{border:1px solid var(--line);padding:3px 5px;text-align:left;vertical-align:top}
.buku .box th{background:var(--panel2);font-weight:600}
.buku .box .row{display:flex;gap:8px;margin-top:12px}
.buku .box .row button{flex:1}
.buku .steps button{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
.buku .steps button.done{border-color:var(--ok);color:var(--ok)}
.buku .shake{animation:bkshake .35s}
@keyframes bkshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* title */
.buku .title{align-items:center;justify-content:flex-start;text-align:center;padding:36px 20px;gap:14px;background:radial-gradient(ellipse at 50% 30%,#1c2a4a 0%,#0f1626 60%)}
.buku .title .ttop{display:flex;flex-direction:column;gap:10px;align-items:center}
.buku .title .tsp{flex:1}
.buku .title h1{margin:0;font-size:38px;letter-spacing:4px;color:var(--acc);text-shadow:0 2px 6px rgba(0,0,0,.8),0 0 24px rgba(255,179,71,.35)}
.buku .title .sub{text-shadow:0 1px 4px rgba(0,0,0,.9)}
.buku .title .sub{color:var(--sub);font-size:13px}
.buku .doors{display:flex;gap:8px;width:100%;max-width:420px}
.buku .door{flex:1;background:rgba(24,34,56,.88);backdrop-filter:blur(4px);border:2px solid var(--line);border-radius:14px;padding:14px 6px;font-size:14px;line-height:1.4}
.buku .door.open{border-color:var(--acc);cursor:pointer}
.buku .door.open:active{transform:scale(.97)}
.buku .door .big{font-size:30px}
.buku .door .best{font-size:11px;color:var(--sub)}
.buku .door.closed{opacity:.45}
.buku .title .links{display:flex;gap:10px;font-size:13px}
/* result */
.buku .result{align-items:center;justify-content:center;padding:20px;gap:10px;text-align:center}
.buku .result .num{font-size:56px;color:var(--acc);font-weight:700;line-height:1}
.buku .result .gone{text-align:left;font-size:12px;background:var(--panel);border-radius:10px;padding:8px 10px;width:100%;max-width:420px;line-height:1.45}
.buku .result .gone div+div{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.buku .menu{position:absolute;top:40px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:6;display:flex;flex-direction:column;gap:4px;min-width:170px}
.buku .menu[hidden]{display:none}
.buku .menu button{text-align:left}
.buku .toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(255,179,71,.95);color:#1a1200;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;z-index:7;pointer-events:none;animation:bktoast 1.6s forwards}
@keyframes bktoast{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
@media (min-height:760px){.buku .card{font-size:13px;min-height:96px}.buku .rg{height:50px;font-size:12px}}

/* ---- stage mode ---- */
.buku .slist{flex:1;overflow:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.buku .srow{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;font-size:15px;border-radius:14px}
.buku .srow .num{width:30px;height:30px;border-radius:15px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc);flex:0 0 auto}
.buku .srow .nm{flex:1;line-height:1.3}
.buku .srow .nm small{color:var(--sub);font-size:11px}
.buku .srow .st{font-size:16px;letter-spacing:1px}
.buku .srow .st .on{color:var(--acc)}
.buku .srow .st .dim{color:#33405f}
.buku .srow.locked{opacity:.45}
.buku .srow.resume{border-color:var(--ok)}
.buku .srow.resume .num{color:var(--ok)}
.buku .later{color:var(--sub);font-size:11.5px;padding:6px 4px;line-height:1.4}
.buku .ftable{position:absolute;inset:0;padding:14px;display:flex;align-items:center;justify-content:center}
.buku .ftable table{border-collapse:collapse;width:100%;font-size:13px;background:rgba(15,22,38,.8)}
.buku .ftable td,.buku .ftable th{border:1px solid var(--line);padding:6px 8px;line-height:1.4}
.buku .ftable th{background:var(--panel2)}
.buku .ftable .lab{font-weight:700;color:var(--acc);text-align:center;width:44px}
.buku .qtext{padding:8px 12px 4px;font-size:15px;line-height:1.45;flex:0 0 auto}
.buku .mid .resline{margin-top:auto}
.buku .qtext .qn{color:var(--acc);font-weight:700;margin-right:6px}
.buku .input{padding:4px 10px}
.buku .mid{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding-bottom:4px}
.buku .choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.buku .ch{text-align:left;display:flex;gap:6px;align-items:flex-start;padding:9px 10px;font-size:13px;line-height:1.35;min-height:52px;border-radius:12px}
.buku .ch .k{color:var(--acc);font-weight:700;flex:0 0 auto}
.buku .ch.right{border-color:var(--ok);background:#173427;color:#c9f5cf}
.buku .ch.wrong{border-color:var(--bad);background:#3a1c1c;color:#ffb4b4}
.buku .ch:disabled{opacity:.8}
.buku .hint{color:var(--sub);font-size:13px;padding:10px 4px;text-align:center}
.buku .order{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.buku .oc{text-align:left;display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12.5px;line-height:1.3}
.buku .oc .k{width:22px;height:22px;border-radius:11px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--acc);flex:0 0 auto}
.buku .oc.on{border-color:var(--acc)}
.buku .resline{margin:4px 10px;padding:8px 10px;border-radius:10px;font-size:13px;line-height:1.4;background:var(--panel);flex:0 0 auto}
.buku .resline.good{border:1px solid #2f5a3a;color:#c9f5cf}
.buku .resline.bad{border:1px solid #5a2f2f;color:#ffd0d0}
.buku .starsbig{font-size:34px;color:var(--acc);letter-spacing:4px}
/* 数値入力（テンキー） */
.buku .numwrap{display:flex;align-items:baseline;justify-content:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:48px}
.buku .numwrap .disp{font-size:26px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;min-width:1ch}
.buku .numwrap .disp:empty::before{content:'—';color:var(--sub)}
.buku .numwrap .unit{font-size:14px;color:var(--acc)}
.buku .numwrap.right{border-color:var(--ok)}
.buku .numwrap.wrong{border-color:var(--bad)}
.buku .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.buku .key{font-size:19px;padding:10px 0;font-variant-numeric:tabular-nums}
</style>

  // ================= ステージ10：状態変化 =================

    // ================= ステージ9：溶解度曲線 =================

  function saveResume() { if (!S) return; lsSet(KEY.resume, JSON.stringify({ n: S.n, seed: S.seed, pi: S.pi, si: S.si, correct: S.correct })); }

  const curP = () => S.problems[S.pi];
  const curSub = () => curP().subs[S.si];
  function stat() { ui.pStat.innerHTML = `<b>${S.pi + 1}</b>/${P.STAGES[S.n - 1].count}問　正解 ${S.correct}/${S.answered}`; }

  function showSub() {
    busy = false;
    const p = curP(), sub = curSub(); const st = P.STAGES[S.n - 1];
    ui.pTitle.textContent = `${S.n}. ${st.name}`; stat();
    const fig = sub.figOverride || p.fig;
    if (fig.type === 'table') { ui.table.hidden = false; ui.canvas.style.visibility = 'hidden'; renderTable(fig); scene.setFig({ type: 'none' }); }
    else { ui.table.hidden = true; ui.canvas.style.visibility = 'visible'; scene.setFig(fig); }
    ui.qtext.innerHTML = `<span class="qn">(${S.si + 1})</span>${sub.q}`;
    ui.res.hidden = true; ui.next.hidden = true;
    const I = ui.input; I.innerHTML = ''; I.hidden = false;
    if (sub.kind === 'choice') {
      const g = h('div', 'choices');
      sub.options.forEach((o, i) => { const b = h('button', 'ch'); b.innerHTML = `<span class="k">${'アイウエ'[i]}</span><span>${o}</span>`; b.onclick = () => answer(i, b); g.appendChild(b); });
      I.appendChild(g);
    } else if (sub.kind === 'figtap') {
      I.appendChild(h('div', 'hint', '👆 上の図から、集め方を1つタップ'));
      scene.highlight(sub.options);
    } else if (sub.kind === 'num') {
      let buf = '';
      const wrap = h('div', 'numwrap');
      const disp = h('span', 'disp', '');
      const unit = h('span', 'unit', sub.unit);
      wrap.append(disp, unit); I.appendChild(wrap);
      const keys = h('div', 'keys');
      const put = ch => { if (busy) return; SFX.tap();
        if (ch === '←') buf = buf.slice(0, -1);
        else if (ch === '.') { if (!buf.includes('.') && buf) buf += '.'; }
        else { if (buf.replace('.', '').length < 6) buf += ch; }
        disp.textContent = buf; go.disabled = !buf || buf.endsWith('.');
      };
      ['1','2','3','4','5','6','7','8','9','.','0','←'].forEach(ch => { const b = h('button', 'key', ch); b.onclick = () => put(ch); keys.appendChild(b); });
      I.appendChild(keys);
      const go = h('button', 'primary', 'こたえる'); go.disabled = true; go.style.width = '100%'; go.style.marginTop = '6px';
      go.onclick = () => { if (busy || !buf) return; answer(buf, null); };
      ui.numGo = go; ui.numDisp = disp; I.appendChild(go);
    } else if (sub.kind === 'order') {
      const g = h('div', 'order'); const seq = [];
      sub.options.forEach(o => {
        const b = h('button', 'oc'); b.innerHTML = `<span class="k"></span><span>${o}</span>`;
        b.onclick = () => { if (busy || seq.includes(o)) return; SFX.tap(); seq.push(o); b.classList.add('on'); b.querySelector('.k').textContent = seq.length; if (seq.length === 4) answer(seq.slice(), null); };
        g.appendChild(b);
      });
      const clr = h('button', 'wait', 'やり直す'); clr.onclick = () => { if (busy) return; SFX.tap(); seq.length = 0; g.querySelectorAll('.oc').forEach(b => { b.classList.remove('on'); b.querySelector('.k').textContent = ''; }); };
      I.appendChild(g); I.appendChild(clr);
    }
  }
  function renderTable(fig) {
    let html = '<table><tr><th>気体</th><th>実験の結果・性質</th></tr>';
    for (const r of fig.rows) html += `<tr><td class="lab">${r.label}</td><td>${r.clues.join('<br>')}</td></tr>`;
    ui.table.innerHTML = html + '</table>';
  }
  function onCanvasTap(e) {
    if (busy || !S) return; const sub = curSub(); if (sub.kind !== 'figtap') return;
    const m = scene.hit(e.clientX, e.clientY); if (!m) return;
    SFX.tap(); scene.choose(m); scene.highlight(null); answer(m, null);
  }

  function answer(input, btn) {
    if (busy) return; busy = true;
    const sub = curSub(); const ok = P.judge(sub, input);
    if (btn) btn.classList.add(ok ? 'right' : 'wrong');
    if (sub.kind === 'choice') ui.input.querySelectorAll('.ch').forEach((b, i) => { b.disabled = true; if (i === sub.answer) b.classList.add('right'); });
    if (sub.kind === 'order') ui.input.querySelectorAll('button').forEach(b => b.disabled = true);
    if (sub.kind === 'num') { ui.input.querySelectorAll('button').forEach(b => b.disabled = true); if (ui.numDisp) ui.numDisp.parentElement.classList.add(ok ? 'right' : 'wrong'); }
    S.answered += 1; if (ok) S.correct += 1;
    const a = sub.anim ? { ...sub.anim } : null;
    if (a) {
      if (a.type === 'collect') a.method = sub.kind === 'figtap' ? input : (a.method || sub.answer); // 選んだ方法で動かす（間違いなら逃げる／とける）
      if (a.type === 'thermo') a.pos = sub.kind === 'figtap' ? input : 'branch'; // 選んだ位置に温度計を置く
      if (a.type === 'run' && !ok && sub.q.includes('口を少し下げ')) a.crack = true;
      if (a.type === 'burner') a.ok = ok;
    }
    const finish = () => {
      ui.res.hidden = false; ui.res.className = 'resline ' + (ok ? 'good' : 'bad');
      ui.res.innerHTML = `<b>${ok ? '○ 正解' : '✕ 正解：' + P.answerText(sub)}</b><br>${sub.why}`;
      ui.next.hidden = false; ui.bNext.textContent = (S.si === 2 && S.pi === S.problems.length - 1) ? '結果を見る ▶' : 'つぎへ ▶';
      stat(); if (ok) SFX.ok(); else SFX.bad();
      setTimeout(() => { try { ui.res.scrollIntoView({ block: 'end', behavior: 'smooth' }); } catch (e) {} }, 30);
      busy = false; saveResume();
    };
    if (a) { if (a.type === 'run' || a.type === 'collect') SFX.fizz(); if (a.test === 'match') setTimeout(SFX.pon, 900); scene.play(a, finish); }
    else setTimeout(finish, 250);
  }
  function onNext() {
    if (busy) return; SFX.tap();
    scene.clearAnim();
    if (S.si < 2) S.si += 1; else { S.si = 0; S.pi += 1; }
    if (S.pi >= S.problems.length) { finishStage(); return; }
    showSub();
  }

  // ---------- result ----------
  function buildResult() { const s = h('div', 'screen result'); s.hidden = true; ui.result = s; root.appendChild(s); }
  function finishStage() {
    lsDel(KEY.resume);
    const total = S.total, c = S.correct; const rate = c / total;
    const sc = c === total ? 3 : rate >= 0.75 ? 2 : 1;
    const prev = stars(S.n); if (sc > prev) lsSet(KEY.stage(S.n), String(sc));
    const s = ui.result; s.innerHTML = '';
    s.appendChild(h('div', 'sub', `ステージ${S.n} ${P.STAGES[S.n - 1].name}`));
    s.appendChild(h('div', 'num', `${c} / ${total}`));
    s.appendChild(h('div', 'starsbig', '★'.repeat(sc) + '☆'.repeat(3 - sc)));
    s.appendChild(h('div', null, sc >= 2 ? (sc === 3 ? '全問正解！' : 'クリア！') : `あと ${Math.ceil(total * 0.75) - c} 問でクリア（${Math.ceil(total * 0.75)}／${total}）`));
    const row = h('div', 'links'); row.style.display = 'flex'; row.style.gap = '10px';
    const nextN = S.n + 1;
    if (sc >= 2 && nextN <= P.STAGES.length) { const b = h('button', 'primary', `ステージ${nextN}へ ▶`); b.onclick = () => { SFX.tap(); startStage(nextN, null); }; row.appendChild(b); }
    const b1 = h('button', sc >= 2 ? '' : 'primary', 'もういちど'); b1.onclick = () => { SFX.tap(); startStage(S.n, null); };
    const b2 = h('button', null, 'ステージ一覧'); b2.onclick = () => { SFX.tap(); showStages(); };
    row.append(b1, b2); s.appendChild(row);
    ui.play.hidden = true; s.hidden = false;
    if (sc === 3) SFX.fanfare(); else if (sc === 2) SFX.ok();
  }

  return { mount, unmount };
})();

</script>
<script>BukuGame.mount(document.getElementById('buku-root'), { homeUrl: location.pathname.includes('/uchu/') ? './' : null });</script>
</body></html>
