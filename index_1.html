<head>

<title>宇宙アプリ</title>
<style>
  html,body{margin:0;min-height:100%;background:#070a14;color:#e9edf7;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
